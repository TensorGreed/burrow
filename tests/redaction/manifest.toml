# The redaction corpus, and the verdict ADR 0029 owes each fixture.
#
# THIS FILE ASSERTS DECISIONS, NOT FILES.
#
# A corpus that only holds documents is a pile of documents. Every placement below carries the
# verdict `docs/adr/0029-what-redaction-does-and-what-it-refuses-to-do.md` §3 assigns it —
# `handle`, `refuse` or `disclose` — so the corpus is an executable form of that table. When the
# operation lands, a fixture whose behaviour disagrees with its verdict fails, and the ADR and
# the implementation cannot drift apart quietly.
#
# TWO KINDS OF FIXTURE, TWO LIFECYCLES
#
#   kind = "producer"    Committed. Made by a real word processor, typesetter or OCR program.
#                        Cannot be regenerated in CI — see PROVENANCE.md for the exact versions.
#   kind = "hand-built"  Not committed. Deterministic, regenerated on demand by
#                        `tools/make-redaction-fixtures.py`.
#
# ADR 0029 §8'S RULE, AND THE HALF OF IT THAT IS CHECKABLE TODAY
#
#   > Where a check reports that something is gone, it must also show that something changed.
#
# Each placement therefore carries two fields, not one:
#
#   witness_before   how we know the canary is in this file NOW. `tools/check-redaction-corpus.py`
#                    verifies every one of these on every run. A placement whose canary cannot be
#                    witnessed is a placement measuring nothing, and the checker refuses.
#   expect_after     what must be true once redaction runs: `gone`, `refused` or `present`.
#                    Checked by `tools/check-redaction-corpus.py --after` (#176) against a real
#                    run, with the SAME witness as `witness_before`. Written before the code it
#                    judges; a disagreement is a finding, not a number to re-fit.
#   owed_by          an issue whose work the outcome is owed to: a refusal signal not yet built
#                    (#125) lets the document redact, a handling not yet built (#131) lets it
#                    refuse. Never excuses a canary still witnessed after a redaction, and FAILS
#                    once the work arrives, so it cannot outlive what it waits for.
#   witness_after    the witness used after the run instead of `witness_before`, where that one
#                    reads only residue a redaction keeps by design (§7). It must also find the
#                    canary before the run -- the checker enforces it.
#   region           on a fixture: the rectangle redacted, in display coordinates. Hand-built
#                    fixtures default to `tools/pdfbuild.py`'s REGION, which draws them.

[meta]
version = 1
adr = "docs/adr/0029-what-redaction-does-and-what-it-refuses-to-do.md"
issue = 135
keep_line = "KEEP-THIS-LINE"

