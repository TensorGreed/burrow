# ---------------------------------------------------------------------------------------
# #125's EVASION FIXTURES, and their near-miss twins.
#
# ADR 0029 §5: a refusal keyed on something the operation cannot see is a bypass, and no
# refusal may ship until its signal has fired on a fixture built to evade it. Each `evade-`
# entry puts the thing a refusal must catch where the PROPOSED signal does not look.
#
# Every refusal has at least one `nearmiss-` twin that must NOT be refused. Without it a signal
# passes every evasion by refusing everything, which is an outage rather than a signal. The
# generator refuses to run if any refusal has evasions and no twin.
#
# NOT COMMITTED:  python3 tools/make-evasion-fixtures.py <dir>
# ---------------------------------------------------------------------------------------

[[fixture]]
name = "evade-image-in-form"
file = "generated/evade-image-in-form.pdf"
