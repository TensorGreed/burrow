[[fixture]]
name = "producer-ocr-scan"
file = "fixtures/producer-ocr-scan.pdf"
kind = "producer"
producer = "pdfTeX + PDFium raster + tesseract 5.3.4"
pages = 1
notes = """
A scanned page: the text is PIXELS, and an invisible text layer sits over it. Built the way the
real pipeline runs — typeset, rasterise through PDFium so only pixels remain, degrade the way a
scanner does, then let tesseract read it back. The text layer is genuine OCR output.

Measured in the qdf expansion:

  * `q 1748.571 0 0 2262.857 0 0 cm /Im1 Do Q` — a full-page DeviceGray image, 1700x2200
  * `BT` then `3 Tr` — text render mode 3, invisible
  * a CID font with 2-byte hex codes and per-run `Tz` horizontal scaling, which tesseract uses
    to stretch each word to match the image
  * a /ToUnicode with a bfrange, so the layer IS extractable
  * tesseract recognised both canaries exactly
"""

  [[fixture.placement]]
  channel = "the page image — the secret as pixels"
  canary = "BURROW-SECRET-SCAN"
  verdict = "refuse"
  adr = "§3"
  witness_before = "image-covers-page"
  witness_observes = "carrier"
  expect_after = "refused"

  [[fixture.placement]]
  channel = "the invisible OCR text layer (3 Tr)"
  canary = "BURROW-SECRET-SCAN"
  verdict = "refuse"
  adr = "§3"
  witness_before = "pdfium-text"
  witness_observes = "canary"
  expect_after = "refused"

  [fixture.decision]
  # ---------------------------------------------------------------------------------
  # A STATED DECISION, NOT A DISCOVERY.
  # ---------------------------------------------------------------------------------
  summary = "Not Only PDF refuses scanned documents, and scanned documents are common."
  body = """
ADR 0029 §3 refuses a page whose region intersects an image. Every region on this page
intersects one, because the page IS an image. So a scanned document is refused outright — and
scans are among the most common things a person would bring to a redaction tool, which is
exactly why this must be a decision somebody took rather than something the first user finds.

CONFIRMED BY MEASUREMENT, not by reading the rule: this fixture has a full-page image draw and
an invisible text layer, which is the shape §3's image rule keys on.

WHY IT IS REFUSED, CORRECTED. The first draft of this entry said that removing the pixels would
mean deciding WHICH pixels, and that deciding meant recognising text in a bitmap, and therefore
OCR. That is wrong, and it is wrong in a way worth recording because it made a solvable problem
look unsolvable.

Redaction here is REGION-BASED. The person selects the region, so which pixels is not a
question anybody has to answer: every pixel inside the selected rectangle is blacked out, and
the invisible text glyphs whose boxes fall in the same region are removed by the ordinary
content-stream path. No recognition is involved at any point.

THE ACTUAL BLOCKER IS RE-ENCODING THE EDITED IMAGE, and it is per filter:

  /FlateDecode, greyscale or RGB   Straightforward. Decode, black out the region's pixels,
                                   re-deflate. zlib is already linked and the image dictionary
                                   needs no change beyond /Length.
  /DCTDecode                       Harder, and lossy. Re-encoding the whole image imposes
                                   generation loss on the parts nobody touched. Editing in the
                                   DCT domain — zeroing the coefficient blocks the region covers
                                   — avoids that and is specialised work.
  /JBIG2Decode                     Hardest. Symbol dictionaries are shared across pages, neither
                                   engine decodes them here, and spike 0005 refused jbig2enc on
                                   correctness grounds rather than licence ones.

So v1 refuses because burrow cannot write the image back, not because it cannot tell what to
remove. THIS FIXTURE IS FLATE GREYSCALE — the easy case — which makes it the right one to
measure against when the condition is taken up.

Recorded as ADR 0029's third named condition for revisiting, alongside hb-subset and the
catalogue wall.

WHAT THE PAGE OWES A PERSON. A refusal that says only "this document cannot be redacted" is a
dead end for the commonest case there is, and it would also be misleading: the limit is
temporary and specific. §7's voice requires the reason, and the reason is that the page is a
picture and burrow cannot yet write a changed picture back. #136 carries the copy.
"""

