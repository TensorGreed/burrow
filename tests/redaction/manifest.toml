[[fixture]]
name = "producer-latex"
file = "fixtures/producer-latex.pdf"
kind = "producer"
producer = "pdfTeX 3.141592653-2.6-1.40.25 (TeX Live 2023/Debian)"
pages = 1
notes = """
A typesetter's output, and the most structurally unlike anything hand-built in this corpus.
Measured in the qdf expansion:

  * the canary is SPLIT BY KERNING across a TJ array — `[(BURROW-SECRET-LA)1(TEX)]TJ`. A
    contiguous literal scan of the content stream finds `BURROW-SECRET-LA` and stops. This is
    spike 0006's channel 2 occurring naturally, in a document nobody built to be adversarial.
  * ligature substitution elsewhere on the page — `<6f1e6365>` and `\\034` for `ffi` — so the
    glyphs drawn are not the characters typed.
  * Type1 subsets with /Differences, not TrueType. Three /Differences arrays — and they use
    SYNTHETIC glyph names, `/a66` rather than `/B`, where the number is the character code.
    No hand-built fixture here uses that encoding, and the corpus checker refused this
    fixture's font placement until it learned to decode it. ADR 0029 §1's "drop its
    /Differences entry" therefore has to handle synthetic names, not only AGL ones.
  * text extraction is LOSSY on this document even though nothing lies: PDFium reads
    "Field oce nding" for "Field office finding", because the subset has no /ToUnicode for the
    ligature glyphs. Real evidence for §6's refusal to treat extraction as admissible.
"""

  [[fixture.placement]]
  channel = "page text, Type1 subset, canary split across a TJ array by kerning"
  canary = "BURROW-SECRET-LATEX"
  verdict = "handle"
  adr = "§1, §3"
  witness_before = "pdfium-text"
  witness_observes = "canary"
