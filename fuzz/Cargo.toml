# A separate workspace on purpose: cargo-fuzz requires it, and fuzzing needs nightly,
# which the pinned stable toolchain in rust-toolchain.toml would otherwise override.
# `fuzz` is listed in the root workspace's `exclude`.
[package]
name = "burrow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
burrow-core = { path = "../core/burrow-core" }
libfuzzer-sys = "0.4"

# A direct dependency on the engine crate, with the engines linked.
#
# The entry point being fuzzed is `DocumentEngine::open`, which lives here. It is not
# reachable through `burrow-core` yet: `page_count` is an engine capability, not a
# `burrow-ops` operation, and the first operation lands in M1 PR 5. When it does, this
# target keeps its place -- the engine boundary is what our fuzzing is actually for (see
# the target's docs and ADR 0004).
burrow-engines = { path = "../core/burrow-engines", features = ["native-engines", "fuzzing"] }
burrow-types = { path = "../core/burrow-types" }
# The merge target drives the operation, not the engine seam directly: the multi-document
# path it explores is `burrow-ops`'s loop plus qpdf's writer, and only this crate has both.
burrow-ops = { path = "../core/burrow-ops", features = ["native-engines"] }

[[bin]]
name = "document_open"
path = "fuzz_targets/document_open.rs"
test = false
doc = false
bench = false

# Pure Rust: no engine to link, and the one target where coverage-guided fuzzing actually
# steers the code under test rather than a prebuilt black box.
[[bin]]
name = "prescan"
path = "fuzz_targets/prescan.rs"
test = false
doc = false
bench = false

# Built against the INSTRUMENTED qpdf archive via a RUSTFLAGS override; see the target's
# docs. qpdf is built from source, so unlike PDFium it can be instrumented.
[[bin]]
name = "split"
path = "fuzz_targets/split.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge"
path = "fuzz_targets/merge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qpdf_check"
path = "fuzz_targets/qpdf_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rotate"
path = "fuzz_targets/rotate.rs"
test = false
doc = false
bench = false

# THE ONLY TARGET THAT REACHES PAST PDFIUM'S OPEN-AND-COUNT (#57), and since ADR 0027's
# amendment the only one that drives its PROGRESSIVE render loop. Everything behind
# `FPDF_RenderPageBitmap_Start` -- the content-stream interpreter, the font stack, the image
# decoders, HarfBuzz, ICU, lcms and OpenJPEG -- is unreachable from every other target here.
[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compress"
path = "fuzz_targets/compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reorder"
path = "fuzz_targets/reorder.rs"
test = false
doc = false
bench = false

# Pure Rust, like `prescan` and for the same reason: no engine to link, so coverage-guided
# fuzzing actually steers the code under test. Both read bytes qpdf hands back -- a decoded
# content stream and an unparsed dictionary -- which are as attacker-controlled as the file
# they came out of.
[[bin]]
name = "pdfsyntax_names"
path = "fuzz_targets/pdfsyntax_names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdfsyntax_dict_keys"
path = "fuzz_targets/pdfsyntax_dict_keys.rs"
test = false
doc = false
bench = false

# The rewriter's two entry points (#128, ADR 0029 §4). Same input shape as `pdfsyntax_names` --
# a decoded content stream -- and a different answer: these return SPANS, and a rewriter cuts the
# page's bytes at them. A span one byte wrong splices into the middle of a token.
[[bin]]
name = "pdfsyntax_operations"
path = "fuzz_targets/pdfsyntax_operations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdfsyntax_contents"
path = "fuzz_targets/pdfsyntax_contents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdfsyntax_geometry"
path = "fuzz_targets/pdfsyntax_geometry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdfsyntax_cmap_wmode"
path = "fuzz_targets/pdfsyntax_cmap_wmode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdfsyntax_tounicode"
path = "fuzz_targets/pdfsyntax_tounicode.rs"
test = false
doc = false
bench = false
