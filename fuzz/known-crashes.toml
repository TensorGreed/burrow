# Crashes the nightly fuzzer is EXPECTED to find, because a filed issue already owns them.
#
# WHY THIS FILE EXISTS
# The seeded nightly has been red continuously since 2026-09-14 because #62 is open and is
# reachable from every qpdf-driving target. ADR 0025 records that a crash there is "a report with
# an owner" rather than a blocked merge -- which is correct, and which cost exactly what a
# permanently-red gate always costs: on 2026-09-18 the nightly also found #119, a DIFFERENT
# defect in a different class, and it was indistinguishable from the standing failure. A gate
# that is always red carries no information.
#
# So: a crash matching an entry here is reported and the job stays green. A crash matching
# nothing is a NEW finding and fails the run.
#
# THE KEY IS THE PAIR (verdict, frame), AND THAT IS NOT A DETAIL.
# `QPDF::Doc::Pages::pushInheritedAttributesToPageInternal` appears in the stack of BOTH #62's
# page-tree use-after-free and #119's stack overflow -- measured, in this repository, from two
# reproductions. Keyed on the frame alone, the #62 entry below would silence #119 outright.
# Keyed on the verdict alone, every use-after-free anywhere in qpdf would match. Only the pair
# distinguishes them.
#
# BOTH ARE LISTED NOW (2026-10-08), each under its own verdict, so the frame is shared between two
# entries and only the verdict half tells them apart. Do not "simplify" the matching.
#
# NOT KEYED ON THE INPUT. Hashing reproducers would match nothing: every night's mutation
# produces different bytes for the same defect. The pair is stable across nights; the bytes are
# not. It also means this file carries no reproducer, so it can live in a public repository --
# see docs/security/exposure-2026-09-14-published-reproducers.md for why that matters here.
#
# AN ENTRY IS A CLAIM THAT EXPIRES. `tools/check-known-crashes.py --check-issues` fails when an
# entry names an issue that is closed: the defect is fixed, so the crash must stop being
# expected, and the ledger must not keep absorbing it. Without that rule this file is a mute
# button, and mute buttons accrete.
#
# WHAT A MATCH DOES NOT PROVE, stated here because this file is what a person adding an entry
# reads. A match means the report is CONSISTENT WITH the named defect -- the same verdict in the
# same function -- not that it is that defect. A second defect in the same function under the
# same sanitiser verdict would be absorbed by the entry above it and nobody would be told. That
# is the residual of any fingerprint short of the whole stack, and the whole stack is not stable
# from night to night.
#
# The `verdict` is the sanitiser's phrase with spaces hyphenated -- `heap-use-after-free`,
# `stack-overflow`, `deadly-signal`. `tools/check-known-crashes.py --check` refuses a spelling
# the classifier could never resolve, so a typo here is a refusal rather than an inert entry.
#
# ADDING AN ENTRY IS A DECISION. It means "this crash is understood, filed, and owned". It is not
# a way to make a red nightly go green.
#
# #119 WAS LEFT OUT UNTIL 2026-10-08, deliberately: an unfixed defect in a library the shipped
# web build embeds, not yet acted on. The owner reversed that on 2026-10-08, when it was handled
# privately. It had recurred on 2026-10-05 and 2026-10-06.
#
# WHAT LISTING DOES NOT FIX. An entry matches a report's frames. A #119 night whose sanitiser
# report carries no frames at all -- 2026-10-05's rotate run was exactly that -- matches no entry
# and stays red as a classifier failure. That is the fail-closed direction, and it is correct.
#
# The note on an upstream entry is neutral by decision, and says nothing of the shape. The issue
# is where an owner reads more.
#
# A PANIC KEY, FOR A DEFECT THAT LEAVES NO SANITISER FRAME (#285, 2026-10-08). qpdf can trap an
# internal error itself and report it, which burrow maps to `Error::Internal`; a fuzz target
# panics on that deliberately, so the report is a libFuzzer `deadly-signal` whose frames are the
# target's panic, not qpdf's. Such an entry carries `panic_at` -- the target FILE, since its line
# moves with every edit -- and `panic`, the EXACT message line, which must directly follow the
# `panicked at` line for that file. The classifier refuses an entry with both a frame and a panic,
# or a panic with only one half.
#
# WHAT #285'S ENTRIES ABSORB, stated where an owner adding one reads it. A shipped burrow's
# `Internal` error carries no qpdf text, by design (DECISIONS.md rule 13). In a FUZZ build only,
# two qpdf internal errors are told apart by qpdf's fixed text and given burrow's own fixed
# messages (`codes::qpdf::internal_from_detail`): #285's invariant failure, which these entries
# key on, and a `qpdf_oh` qpdf does not hold -- burrow's own defect, which now panics with its own
# message and is never absorbed here. So these entries match **any input that drives qpdf to that
# same invariant failure** under compress or rotate -- the same check, perhaps a different cause --
# and nothing else: every other qpdf internal error still panics with the generic message, which
# matches no entry and turns the nightly red. If a qpdf upgrade rewords either text, the mapping
# falls back to the generic message and the nightly goes red rather than silent;
# `qpdf::error_text_tests` goes red first. The entries expire with #285 like every entry here.

[[known]]
issue = 62
verdict = "heap-use-after-free"
frame = "QPDF::Doc::Objects::Foreign::Copier::reserve_objects"
reached_from = ["merge"]
note = """The foreign-object copier use-after-free, recorded in
docs/security/exposure-2026-09-14-qpdf-uaf.md section 7 as the second of #62's two defects."""

[[known]]
issue = 62
verdict = "heap-use-after-free"
frame = "QPDF::Doc::Pages::pushInheritedAttributesToPageInternal"
reached_from = ["reorder", "compress", "rotate", "split", "qpdf_check"]
note = """The page-tree caching use-after-free, reached by OPENING a document -- so every
qpdf-driving target can hit it, which is why the failing set shifts from night to night. The
stack recorded in ADR 0025 is this one."""

[[known]]
issue = 119
verdict = "stack-overflow"
frame = "QPDF::Doc::Pages::pushInheritedAttributesToPageInternal"
reached_from = ["reorder", "rotate"]
note = """upstream, reported privately"""

[[known]]
issue = 285
verdict = "deadly-signal"
panic_at = "fuzz_targets/compress.rs"
panic = "compress reported an internal error: qpdf reported an internal error: an uninitialized object made indirect"
reached_from = ["compress"]
note = """upstream, reported privately"""

[[known]]
