# cargo-deny configuration. This file is the machine-readable form of
# non-negotiable #2 in CLAUDE.md: permissive licenses only.
#
#   cargo deny check                    # everything
#   cargo deny check licenses           # just the allowlist
#
# Changing the `allow` list below is a licensing policy decision. It requires an ADR
# amending docs/adr/0003-permissive-licensing.md, not just a commit.

[graph]
# Check every target we ship to, so a platform-specific GPL dependency cannot slip in
# through a target we do not build on CI's host.
targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[licenses]
# Anything not on this list fails the build. Note the absence of every GPL/LGPL/AGPL
# variant, SSPL, and all non-commercial licenses.
#
# This list covers RUST CRATES ONLY -- it is all cargo-deny can see. The native engines
# and everything they bundle are governed by the same policy but checked separately, via
# engines/licenses.toml and tools/check-engine-licences.py, which run in the same CI job.
#
# ADR 0008 widened the policy allowlist with FTL, IJG, libpng-2.0 and LicenseRef-AGG-2.3.
# Those are deliberately NOT added here: no Rust crate uses them, and an entry cargo-deny
# never matches is noise that outlives the reason for it. Add one here if and when a crate
# actually needs it.
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
# A crate whose license we cannot determine is treated as forbidden ("anything unclear").
unused-allowed-license = "allow"
confidence-threshold = 0.93

# Every exception must name the crate and the reason. Empty by design: prefer replacing
# a dependency over granting it an exception.
exceptions = []

[licenses.private]
# We do not publish the workspace crates to crates.io yet; do not require license text
# resolution for our own `publish = false` crates.
ignore = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
yanked = "deny"
unmaintained = "all"
# Empty by design. Adding an ID here means knowingly shipping a known vulnerability:
# it needs a dated comment saying why, and an issue tracking its removal.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Prefer a dependency graph we can actually audit.
external-default-features = "allow"

# Two groups, both named explicitly so the failure message says why rather than just
# which. If one of these ever appears in the graph, that is a privacy or licensing
# review, not a routine dependency bump.
#
# The HTTP clients first: nothing in burrow may reach the network from a code path
# touching file content. A transitive HTTP client is the most likely way that guarantee
# erodes, because it usually arrives as an implementation detail of something else.
deny = [
    { crate = "reqwest", reason = "non-negotiable #1: no networking in core" },
    { crate = "hyper", reason = "non-negotiable #1: no networking in core" },
    { crate = "ureq", reason = "non-negotiable #1: no networking in core" },
    { crate = "curl", reason = "non-negotiable #1: no networking in core" },
    { crate = "isahc", reason = "non-negotiable #1: no networking in core" },
    { crate = "surf", reason = "non-negotiable #1: no networking in core" },
    { crate = "attohttpc", reason = "non-negotiable #1: no networking in core" },
    # Then the TLS stacks. These are also licensing problems (OpenSSL 1.x terms; ring's
    # custom non-OSI license), but the reason we do not want them is more basic: a TLS
    # implementation has nothing to do in software that never opens a socket.
    { crate = "openssl", reason = "no TLS or networking in core" },
    { crate = "openssl-sys", reason = "no TLS or networking in core" },
    { crate = "ring", reason = "no TLS or networking in core" },
]

# Crates exempted from the `multiple-versions` check above. Empty: we would rather
# unify a duplicated dependency than silence the warning about it.
skip = []

# The web target needs its own guard. `web-sys` is a single crate gating the entire
# browser API behind features, so denying the crate is not an option — we will need
# plenty of it for file handling and workers. Deny the features that hand a page the
# ability to talk to the network instead, so non-negotiable #1 is enforced on the web
# by the same mechanism as everywhere else.
[[bans.features]]
crate = "web-sys"
deny = ["RequestInit", "WebSocket", "XmlHttpRequest", "EventSource"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
