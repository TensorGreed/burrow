[package]
name = "burrow-ops"
description = "File operations (merge, split, rotate, redact, ...) built on burrow's engine seams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
burrow-types.workspace = true
burrow-engines.workspace = true

[features]
default = []
# Forwards to `burrow-engines/native-engines`, so `tests/merge.rs` can drive the real qpdf
# assembler.
#
# THE TESTS LIVE HERE RATHER THAN IN `burrow-engines`, and the direction of the dependency
# is why: `merge` is an operation, operations live in this crate, and a `burrow-engines`
# test that reached back for `burrow-ops` would be a dependency cycle dressed up as a
# dev-dependency. `core/CLAUDE.md` draws that arrow deliberately.
#
# Same shape as the flag it forwards to: off by default, so the rest of the workspace
# builds with no engines present, and `build.rs` FAILS rather than skipping when it is on
# and they are missing.
native-engines = ["burrow-engines/native-engines"]

[dev-dependencies]
# Property tests. Required by the definition of done, not optional per operation.
proptest = { version = "1", default-features = false, features = ["std"] }
# The differential conformance corpus moved here in M1 PR B2, from `burrow-engines`.
#
# IT HAD TO MOVE. The corpus now covers `merge`, which is an OPERATION -- so the harness has
# to call `burrow_ops::merge` to compare what the two platforms produce, and `burrow-engines`
# cannot see this crate. A dev-dependency pointing back would be the dependency cycle
# `core/CLAUDE.md` draws an arrow to prevent, wearing a different hat. The file reads
# `burrow-engines`' `testsupport/expectations.rs` by `#[path]`, so there is still exactly one
# definition of the schema.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
