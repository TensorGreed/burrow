[package]
name = "burrow-engines"
description = "Trait seams over the native engines burrow builds on (PDFium, qpdf, HarfBuzz, ...)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Link the vendored native engines and enable the link-check tests.
#
# OFF by default on purpose. With it off, `cargo build`/`test` need no engines at all, so
# a contributor can work on the rest of the workspace without a 28-second engine build,
# and the wasm and mobile CI jobs stay untouched. CI's `test` job turns it on, with the
# engine build cached on engines/pins.toml.
#
# Requires `engines/fetch.sh && engines/build-native.sh` to have run. If the libraries are
# missing, build.rs FAILS -- it does not quietly skip. A test suite that silently drops
# its riskiest half is worse than one that refuses to run.
native-engines = []

[dependencies]
burrow-types.workspace = true
# Wipes the NUL-terminated copy of a password that PDFium's C API requires, as soon as the
# load returns. Already a dependency of burrow-types for the same reason.
zeroize.workspace = true

[dev-dependencies]
# The provenance test hashes whichever libpdfium the loader actually mapped, so it needs
# the same digest the build script uses. The conformance tests reuse it to pin each
# committed fixture by content.
sha2 = { version = "0.10", default-features = false }
# Property tests. Required by the definition of done, not optional per operation.
proptest = { version = "1", default-features = false, features = ["std"] }
# Reads tests/conformance/expectations.json, which M1 PR 4's web harness reads too -- the
# file is the contract between the two implementations, so neither of them owns it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# For re-verifying the vendored libraries' checksums in build.rs. Shelling out to
# sha256sum was the alternative and was rejected: a subprocess plus a PATH dependency in
# a build script is worse than one small, ubiquitous crate.
sha2 = { version = "0.10", default-features = false }

[lints.rust]
# Relaxed from the workspace `forbid`: this crate wraps C/C++ engines. Every `unsafe`
# block still needs a `// SAFETY:` comment. See CLAUDE.md.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
# Restored from the workspace table, which this crate's hand-rolled list had dropped.
# `c_int` -> `u64` on an attacker-controlled page count is exactly the class these catch.
integer_division = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
