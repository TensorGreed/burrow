name: fuzz (nightly)

# The 60-second smoke in ci.yml runs on every PR and catches the shallow bugs. This is the
# longer run: 10 minutes per target, once a day, where the fuzzer has time to get past the
# header check and into the parser.
#
# Longer runs come later on the self-hosted linux-arm64 machine, with a persistent corpus.
# This workflow deliberately starts from an empty corpus each night — it is a regression
# guard, not a campaign. A finding here is NOT reproducible from anything this job publishes:
# the crashing input stays on the runner (see "Describe the crash without publishing it"), and
# reproducing means re-running the target locally against a seeded corpus. That is deliberate --
# this repository is public and #62's defects are unpatched upstream.

on:
  schedule:
    # 03:17 UTC. Off the hour so it does not queue behind everything else scheduled at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # THE LEDGER IS A CLAIM THAT EXPIRES, and this is what expires it. An entry says "this crash
  # is owned by an open issue"; when the issue closes the defect is fixed, the crash must stop
  # being expected, and the entry must go. Without this the ledger quietly becomes a mute button,
  # and the next finding lands in it unnoticed -- the exact failure it was built to end.
  #
  # ONCE PER RUN, not once per target: it asks GitHub about issues, not about fuzzing.
  ledger:
    name: every expected crash still has an open issue
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the known-crashes ledger against its issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check-known-crashes.py --check-issues

  fuzz:
    # `needs: ledger`, SO THE EXPIRY RULE ACTUALLY GATES. Without it a stale ledger absorbing a
    # fixed defect's crash gives eleven green fuzz jobs beside one red ledger job -- the run is
    # red, but the absorbing already happened. The whole argument for this mechanism rests on
    # entries expiring, so that check runs first and blocks.
    needs: ledger
    name: fuzz ${{ matrix.target }} (10m)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # EVERY TARGET, and it used to be three of them. `merge`, `split`, `rotate` and
        # `reorder` were added to `fuzz/Cargo.toml` over four pull requests and none of them
        # reached this list, so the long run -- the one that is supposed to find what the
        # 60-second smoke run cannot -- had not covered an operation since M1 PR B.
        #
        # `ci.yml`'s "every fuzz target is actually run by this job" guard did not catch it
        # because it read only `ci.yml`. It reads both workflows now.
        target:
          - compress
          - document_open
          - render
          - prescan
          - qpdf_check
          - merge
          - split
          - rotate
          - reorder
          - pdfsyntax_names
          - pdfsyntax_dict_keys
          - pdfsyntax_operations
          - pdfsyntax_contents
          - pdfsyntax_geometry
          - pdfsyntax_cmap_wmode
          - pdfsyntax_tounicode
          - redact_shared_contents
          - redact_verified_output
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pinned action as every other job (its `stable` branch); the `toolchain`
      # input below is what selects nightly, which cargo-fuzz requires.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      # Same cache key as ci.yml's jobs, so this usually restores rather than rebuilds.
      - name: Cache vendored engines
        id: engines-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engines/vendor
          key: engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engines/pins.toml', 'engines/fetch.sh', 'engines/build-native.sh') }}

      - name: Fetch and build engines
        if: steps.engines-cache.outputs.cache-hit != 'true'
        run: |
          engines/fetch.sh
          engines/build-native.sh

      - name: Re-verify engine checksums
        run: engines/fetch.sh

      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-0.13.2

      - if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.13.2 cargo-fuzz

      # SEEDED, unlike the 60-second smoke run in ci.yml, and this is where the difference
      # is meant to show. An unseeded corpus exercises the parser's rejection paths and very
      # little else -- measured: with a defect planted in `reorder`, 577,209 unseeded
      # executions found nothing and one seed failed on the first execution.
      #
      # `merge` and `split` are quarantined out of the pull-request job because seeded they
      # reproduce #62 and #61 respectively. Here they are seeded like everything else, because
      # a nightly crash is a report rather than a blocked merge. What makes it a report is the
      # step below, which names the defect -- the sanitiser's verdict and the symbolised frame --
      # without publishing the input that produced it.
      - name: Seed every corpus from the committed fixtures
        run: python3 tools/seed-fuzz-corpus.py

      # See fuzz/README.md for why each of these is required rather than tuning.
      - name: fuzz ${{ matrix.target }} for 10 minutes
        id: fuzz
        working-directory: fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/engines/vendor/native-$(uname -m)/lib"
          # The INSTRUMENTED archive for every qpdf-backed target, so libFuzzer sees inside
          # qpdf's own parser and writer rather than only our wrapper. It used to be
          # `qpdf_check` alone, described as "the only target that gets coverage feedback from
          # an engine's own code" -- true when it was written and false from the moment
          # `merge` arrived. Both qpdf use-after-frees found on 2026-09-14 are inside qpdf,
          # which is exactly the code this flag makes visible.
          #
          # DERIVED FROM THE TARGET'S OWN SOURCE, NOT RESTATED. The hand-written list has now
          # been wrong twice: it was `qpdf_check` alone until `merge` arrived, and it omitted
          # `compress` -- the target written specifically to reach qpdf's object-stream writer,
          # which then ran here with no coverage feedback from inside qpdf at all. Measured on
          # that target, 60 s seeded: 6,294 covered edges instrumented against 479 plain, a 13x
          # difference. It was a coverage-guided writer fuzzer on paper and a parser-rejection
          # run in fact, and nothing said so. Found by security review.
          #
          # A target needs the instrumented archive exactly when it drives qpdf, and a target
          # that drives qpdf names `burrow_engines::qpdf`. So ask the file. Verified to
          # reproduce the old list exactly, plus compress: qpdf_check, merge, split, rotate,
          # reorder, compress instrumented; document_open, prescan, pdfsyntax_names,
          # pdfsyntax_dict_keys, pdfsyntax_operations, pdfsyntax_contents, pdfsyntax_geometry
          # and pdfsyntax_cmap_wmode not.
          #
          # ASan's malloc interceptors work either way -- the plain build still caught #62 --
          # so the cost of getting this wrong is silent and is coverage, which is the only
          # reason it survived two omissions.
          if grep -q 'burrow_engines::qpdf' "fuzz_targets/${{ matrix.target }}.rs"; then
            export RUSTFLAGS="-L native=$GITHUB_WORKSPACE/engines/vendor/native-$(uname -m)/lib/fuzz"
            echo "instrumented qpdf archive selected for ${{ matrix.target }}"
          else
            echo "${{ matrix.target }} does not drive qpdf; plain build"
          fi
          # THE OUTPUT IS KEPT so the next step can say WHICH defect this was without
          # publishing the input. Redirected and then printed, rather than piped through `tee`:
          # CLAUDE.md's rule is that a command whose status you need never goes on the left of a
          # pipe, and this status is the job's verdict.
          # STREAMED AND KEPT. Process substitution rather than a pipe: the status stays
          # cargo's (CLAUDE.md's rule is about the LEFT of a pipe, and there is no pipe here),
          # the output still appears live during a ten-minute step, and the log survives a
          # cancellation -- a `> file` plus a later `cat` loses everything if the job is killed.
          # REDACTED, NEVER RAW -- see tools/redact-fuzz-log.py. cargo-fuzz prints the whole
          # crashing input as a decimal byte array with no size limit, and libFuzzer prints hex,
          # ASCII and Base64 of any unit under 256 bytes. On a public repository that is the
          # reproducer, published. Measured: all 16,208 bytes of #119's input were recoverable
          # from one line of this job's 2026-09-18 log.
          #
          # File first, redact second, rather than process substitution: a `> >(...)` subshell
          # is not guaranteed to flush before the step ends, and a security control must not
          # rest on that. Live output is the cost; the unredacted log stays on the runner for
          # the next step and dies with it.
          # THE STATUS IS RECORDED, NOT RAISED. This step no longer decides the job: a crash
          # that a filed issue already owns must not fail the run, or the nightly stays red
          # forever and a NEW defect is invisible in it -- which is what happened to #119 on
          # 2026-09-18. The "Classify" step below is the verdict, and it fails the job for an
          # unmatched crash or for a failure that produced no crash report at all.
          status=0
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=600 -timeout=10 -rss_limit_mb=2048 \
            > "$RUNNER_TEMP/fuzz.log" 2>&1 || status=$?
          python3 ../tools/redact-fuzz-log.py < "$RUNNER_TEMP/fuzz.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # THE SIGNAL, NEVER THE PAYLOAD. This step used to be `upload-artifact` over
      # `fuzz/artifacts/`, and on a PUBLIC repository that published a working reproducer for
      # every crash it found -- including, for five consecutive nights, the two unpatched qpdf
      # use-after-frees of #62, whose own text says "no reproducer is attached, here or anywhere
      # in this repository, and none should be added until upstream has had the chance to fix
      # it". The minimised input is deliberately held outside the repository; CI was publishing
      # an unminimised one beside it, downloadable by anyone with `gh run download`.
      #
      # What a reader of a red nightly actually needs is which defect it is, not the bytes that
      # trigger it: the sanitiser's verdict, the frame it happened in, and a hash to tell one
      # crash from another across nights. That is what this emits. The input stays on the runner
      # and dies with it.
      #
      # IF A REPRODUCER IS EVER NEEDED for debugging, it is retrieved deliberately and privately
      # -- re-run the target locally against the seeded corpus, or route it to the same place
      # #62's minimised input already lives. It does not travel through a public artifact store
      # as a side effect of a job failing.
      # THE VERDICT. `always()` because the fuzz step no longer fails the job -- so without this
      # a crash would pass silently, which is the opposite failure to the one being fixed.
      - name: Classify the crash against the issues we already own
        if: always() && steps.fuzz.outputs.status != ''
        # THE SCRIPT IS THE STEP, shared with fuzz-reproduce.yml -- see its header.
        run: |
          tools/fuzz-classify.sh "${{ matrix.target }}" "${{ steps.fuzz.outputs.status }}" \
            "$RUNNER_TEMP/fuzz.log"

      - name: Describe the crash without publishing it
        # ONLY WHEN THE FUZZ STEP ITSELF FAILED. `if: failure()` alone is true when checkout,
        # the engine build, the checksum re-verification, cargo-fuzz's install or the corpus
        # seeding failed -- and this step would then announce "crash", with a verdict, for a
        # build break. A report that is honest only in the case it was written for is a report
        # that misleads in every other case.
        if: >-
          always() && (steps.fuzz.outputs.status != '0' && steps.fuzz.outputs.status != ''
          || steps.fuzz.outcome == 'failure')
        # THE SCRIPT IS THE STEP, shared with fuzz-reproduce.yml -- see its header.
        run: tools/fuzz-describe.sh "${{ matrix.target }}" "$RUNNER_TEMP/fuzz.log"
