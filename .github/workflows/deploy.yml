name: Deploy

# THE LIVE SITE. This workflow holds a credential that can write to it.
#
# TRIGGERS ARE THE SECURITY BOUNDARY, and there are exactly two: a manual dispatch, and a push
# to `main` — which, since the branch ruleset landed, means a merged pull request that passed
# `ci`. There is deliberately NO `pull_request` trigger and there must never be one: a
# `pull_request` run is triggered by a branch anyone can open, and this workflow can write to
# the site people visit. `tools/check-deploy-workflow.sh` enforces that rather than trusting
# this comment, and CI runs it.
#
# `pull_request_target`, `issue_comment` and `workflow_call` are refused by the same check and
# for the same reason: each is a way for content outside `main` to reach a job holding a
# credential.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy is happening (recorded in the run)"
        required: false
        default: "manual"
      sign:
        description: "Also publish and sign a tarball of this exact payload"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]

# ONE DEPLOY AT A TIME, AND NEVER CANCELLED HALF WAY. `cancel-in-progress: false`, unlike
# `ci.yml`: cancelling a build wastes a runner, cancelling an upload leaves the live site
# holding half of one deploy and half of another.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # THE ORIGIN IS A BUILD INPUT, NOT A DEPLOY SETTING (ADR 0014 §4). `connect-src` names the
  # exact content-hashed engine URLs and the worker bundle carries absolute URLs, so a build
  # is bound to one origin and cannot be relocated by uploading it somewhere else. It reaches
  # the CSP, `_headers`, the worker manifest, Astro's `site:` and the run-time stamp through
  # ONE reader, `tools/build-origin.mjs`.
  #
  # Changing this means rebuilding, not redeploying. `tools/check-deployable-build.sh` is
  # invoked with the same value below and refuses a build that disagrees.
  # THE CUSTOM DOMAIN, since 2026-09-16. `burrow-f2s.pages.dev` is still live and still
  # serves these bytes -- Cloudflare keeps a project's pages.dev host permanently and it
  # cannot carry a redirect rule -- but it is no longer the origin this build is FOR.
  #
  # THE CONSEQUENCE IS NOT COSMETIC AND IS STATED HERE RATHER THAN DISCOVERED: a build is
  # bound to one origin (ADR 0014 §4), so on `burrow-f2s.pages.dev` `connect-src` names engine
  # URLs at another origin and every tool there is DEAD. That is by design and it is visible
  # rather than silent -- `src/origin-guard.ts` puts a banner at the top of every page saying
  # which origin the build is for, and now links to it. The canonical link on every page
  # points at the custom domain from the same input, so search consolidates there rather than
  # splitting between two hosts serving identical text.
  BURROW_SITE: https://notonlypdf.com
  # THE PROJECT NAME IS NOT THE HOSTNAME, AND ASSUMING IT WAS COST A RED DEPLOY.
  #
  # The first version derived this from `BURROW_SITE` -- `burrow-f2s.pages.dev` -> `burrow-f2s`
  # -- on the reasoning that Cloudflare names the subdomain after the project. That is its
  # convention and it is not a guarantee: this project is called `burrow`, and Cloudflare
  # generated `burrow-f2s` as the subdomain because `burrow.pages.dev` was taken. The deploy
  # failed with `The Pages project "burrow-f2s" does not exist`.
  #
  # IT FAILED LOUDLY, WHICH IS THE ONLY REASON THIS IS CHEAP. Nothing was uploaded and nothing
  # reached a live site. But a derivation that is right for the wrong reason keeps looking
  # right, and the next person to read it would have re-derived the same wrong answer from the
  # same sound argument.
  #
  # So the two are stated separately, because they are separately true. `BURROW_SITE` is a
  # BUILD input -- it is baked into the CSP and the worker's absolute URLs (ADR 0014 §4) and
  # changing it means rebuilding. `BURROW_PAGES_PROJECT` is a DEPLOY input: which Cloudflare
  # project receives the bytes. A build is bound to the first and says nothing about the second.
  #
  # What stops them disagreeing is no longer a derivation but a READ-BACK: the step after the
  # upload checks wrangler's reported alias against `BURROW_PAGES_HOST` (see below), so a wrong
  # project name fails the run instead of putting a correct build somewhere nobody visits.
  # It used to compare against `BURROW_SITE`, and the custom domain ended that -- wrangler
  # never reports the custom domain, so no correct deploy could satisfy it.
  BURROW_PAGES_PROJECT: burrow
  # A THIRD FACT, AND IT IS NOT DERIVABLE FROM EITHER OF THE OTHER TWO. wrangler reports a
  # per-deployment alias on the PROJECT's pages.dev host, never on the custom domain, so this
  # is the only thing the alias can be checked against. It is not the project name
  # (Cloudflare generated `burrow-f2s` because `burrow.pages.dev` was taken -- the comment
  # above records what assuming otherwise cost) and it is not `BURROW_SITE` any more.
  BURROW_PAGES_HOST: burrow-f2s.pages.dev
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # THE BUILD HOLDS NO SECRETS. Splitting it from the upload is the whole point: this job
  # compiles third-party C++ through emsdk and runs a package manager, and it does so with no
  # credential in its environment. The job that holds the token does almost nothing.
  build:
    name: build the production payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE SAME BUILD CI RUNS, from one definition. Not a copy: this began as sixty
      # duplicated lines and a review diffed them, finding FOUR divergences on day one --
      # including `tools/check-qpdf-crypto.sh`, the gate asserting the shipped qpdf.wasm links
      # native crypto and never GnuTLS, which is LGPL and forbidden by non-negotiable 2. The
      # bytes that actually leave would have gone out without it.
      #
      # Pin-agreement would have caught none of the four: every pin was byte-identical. What
      # drifted was the GATE SET, which is why the fix is one definition rather than a
      # comparison.
      - uses: ./.github/actions/build-web-payload

      # NO `BURROW_HARNESS`. `/harness` exposes `window.burrowHarness`, which drives a real
      # file through the real worker, and `dist/host/` is the lifecycle module it loads. Both
      # are excluded by `astro.config.mjs` unless the flag is set, and the gate below refuses
      # the build outright if either directory exists — so this is asserted, not just omitted.
      - name: Build for ${{ env.BURROW_SITE }}
        working-directory: apps/web
        run: pnpm build

      # THE GATES, BEFORE ANYTHING LEAVES. Both read `apps/web/dist`, which only exists now.
      - name: This build is for this origin and no other
        run: tools/check-deployable-build.sh "$BURROW_SITE"

      - name: PDFium reaches the render bundle and nothing else (ADR 0026)
        run: tools/check-pdfium-is-render-only.sh

      - name: Record what is about to be uploaded
        run: |
          echo "### Payload" >> "$GITHUB_STEP_SUMMARY"
          node tools/report-size-budget.mjs apps/web/dist >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the payload for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error
          # `include-hidden-files` governs paths whose components start with a DOT. An earlier
          # comment here claimed it was what preserved `_headers` -- that is wrong, and
          # `_headers` starts with an underscore and was never excluded. Kept because a build
          # may yet emit a dotted path, and corrected because an overclaiming comment is a bug
          # in this repository, not a wording preference.
          #
          # What actually protects `_headers` is `tools/check-deployable-build.sh`, which
          # fails on its absence AND runs again on the artifact after the round trip. Without
          # that file Cloudflare serves the site with no CSP header, no `frame-ancestors` and
          # no `nosniff`, leaving only the `<meta>` copy.
          include-hidden-files: true

  # THE ONLY JOB WITH THE CREDENTIAL, and it does three things: download, verify, upload.
  publish:
    name: publish to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # CHECKED OUT FOR THE GATE SCRIPT ONLY. `dist/` comes from the artifact, never from a
      # build in this job — a job holding a live-site token does not compile anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-dist
          path: apps/web/dist

      # INSTALLED BEFORE THE GATE, DELIBERATELY. `npx --yes` resolves and installs wrangler's
      # whole transitive tree from the network at run time, in the only job holding the
      # credential, with write access to `apps/web/dist`. Run between the gate and the upload,
      # any `postinstall` in that tree could rewrite the bytes AFTER they were checked --
      # including `_headers`, which is the entire response-header policy. Doing the install
      # first makes the gate the last thing to touch `dist/`.
      #
      # THE RESIDUAL IS NOT CLOSED BY THIS, and is stated rather than implied: the version is
      # pinned and npm forbids republish, but the dependency CLOSURE is not pinned, and this
      # is the one step in either workflow that is not SHA-pinned. Pinning it properly means
      # `wrangler` as a devDependency under `pnpm-lock.yaml`, which is a dependency decision
      # (licence audit, notices entry) rather than a detail.
      - name: Install the pinned wrangler, before anything is verified
        run: npx --yes wrangler@4.132.0 --version

      # THE LAST THING BEFORE THE UPLOAD. The build job already passed this; that is not the
      # same claim. What gets deployed is what came back out of the artifact, so the round
      # trip is checked too -- a dropped `_headers` or a mangled `connect-src` fails here
      # rather than on the live site.
      - name: Re-verify the payload that is actually being uploaded
        run: tools/check-deployable-build.sh "$BURROW_SITE"

      # `--branch main` publishes to production rather than to a preview URL -- but only if the
      # Pages project's production branch IS `main`, which is why the URL is read back below
      # rather than assumed.
      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.132.0 pages deploy apps/web/dist \
            --project-name "$BURROW_PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true 2>&1 | tee wrangler.log

      # AN EXIT CODE IS NOT AN OUTCOME -- READ THE STATE BACK. `CLAUDE.md` records three
      # measured cases of a green exit over something that had not happened, and this is the
      # one workflow whose outcome is a live website.
      #
      # TWO DIFFERENT QUESTIONS, and the first version of this step conflated them:
      #
      #   * WHICH DEPLOYMENT did wrangler create? Always a per-deployment alias
      #     (`https://f55a5097.burrow-f2s.pages.dev`), printed for production deploys too.
      #     `tools/check-deployment-url.sh` answers this, comparing HOST LABELS rather than
      #     characters -- `evil-burrow-f2s.pages.dev` ends with the same characters.
      #   * DID PRODUCTION ACTUALLY UPDATE? Not knowable from wrangler's output at all. The
      #     step below asks the live origin, which is the only honest way.
      #
      # Asserting `reported == $BURROW_SITE` answered neither: no correct production deploy can
      # satisfy it, and it failed a run whose upload had succeeded -- reporting a live site as
      # a red deploy.
      - name: The deployment belongs to the project this build is for
        run: |
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' wrangler.log | tail -1 || true)"
          tools/check-deployment-url.sh "$url" "$BURROW_SITE" "$BURROW_PAGES_HOST"

      # AND THE POLICY ARRIVES AS A REAL RESPONSE HEADER. `_headers` is a file the host chooses
      # to read; ADR 0014 §5 duplicates the CSP into a `<meta>` precisely because a static host
      # may ignore it. Which of the two is in force is a fact about the deployed site, so it is
      # asserted here rather than left for somebody to check by hand.
      - name: The CSP arrives as a header, from the live site
        run: |
          headers="$(curl -sSI --max-time 30 "$BURROW_SITE/" || true)"
          [ -n "$headers" ] || { echo "no response from $BURROW_SITE" >&2; exit 1; }
          printf '%s\n' "$headers" | grep -qi '^HTTP/.* 200' ||
            { echo "$BURROW_SITE/ did not return 200:" >&2; printf '%s\n' "$headers" >&2; exit 1; }
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:' ||
            { echo "no Content-Security-Policy RESPONSE HEADER from $BURROW_SITE -- _headers was
          not read, so only the <meta> copy is in force and frame-ancestors is absent" >&2; exit 1; }
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: *nosniff' ||
            { echo "no nosniff header from $BURROW_SITE" >&2; exit 1; }
          echo "the live site sends a CSP header and nosniff"

      # AND THE CRAWLER FILES ARRIVE, by the same argument the step above makes: which of the
      # two copies of the policy is in force is a fact about the deployed site, and so is
      # whether `/robots.txt` and `/sitemap.xml` are actually served. The build gate asserts
      # they are in `dist/` with the right origin; only the live origin can say the host serves
      # them rather than a 404 page.
      #
      # THE ORIGIN IS CHECKED HERE TOO, because this is the first moment the CUSTOM DOMAIN has
      # been confirmed to serve these bytes at all -- the alias check above establishes only
      # which project received them.
      - name: robots.txt and sitemap.xml are served, and name this origin
        run: |
          for path in robots.txt sitemap.xml; do
            body="$(curl -sS --fail --max-time 30 "$BURROW_SITE/$path")" ||
              { echo "$BURROW_SITE/$path is not served" >&2; exit 1; }
            printf '%s' "$body" | grep -qF "$BURROW_SITE" ||
              { echo "$path does not name $BURROW_SITE:" >&2; printf '%s\n' "$body" >&2; exit 1; }
          done
          echo "the live site serves robots.txt and sitemap.xml, both naming $BURROW_SITE"

      # AND THE BODY IS THE ONE WE BUILT. The two steps above ask the live origin for its
      # HEADERS; this asks it for its DOCUMENTS and diffs them against the artifact that was
      # just uploaded.
      #
      # IT EXISTS BECAUSE EVERY OTHER GATE MISSED AN EDGE INJECTION. Cloudflare Web Analytics
      # rewrote every HTML response on the custom domain to add a beacon script:
      # `check-deployable-build.sh` reads `dist/`, where it does not exist; the zero-requests
      # e2e test runs against a LOCAL server, so the edge is not in the picture; the live step
      # above reads headers, and this is in the body; and plain `curl` gets the clean document,
      # because the rewrite is conditional on the request looking like a browser. The CSP
      # blocked the script, so nothing executed — and a person watching the network tab still
      # saw a request to an analytics host on a site that says there are none.
      #
      # THE RULE IS THE DIFF, not a check for that beacon: the next edge feature will have a
      # different name. `dist/` here is the artifact, not a rebuild, so this compares the live
      # bytes against exactly what was uploaded.
      - name: The live origin serves the body we built, and nothing else
        run: tools/check-live-routes.py "$BURROW_SITE" apps/web/dist

      - name: Say where it went
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- origin: \`$BURROW_SITE\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo ""
            echo "Verify against the live site, not a local preview: the CSP must arrive as a"
            echo "real response header, the policy must reach the worker, the integrity pins"
            echo "must match the bytes Cloudflare serves, and there must be zero requests"
            echo "after engine init."
          } >> "$GITHUB_STEP_SUMMARY"

  # THE SIGNING JOB. A SIBLING OF `publish`, NOT A STEP INSIDE IT, AND THE SPLIT IS THE POINT.
  #
  # Both jobs consume the same `production-dist` artifact, so the bytes that get signed are the
  # bytes that got deployed -- the artifact is the handoff either way, and nothing here rebuilds.
  # What the split buys is that no single job holds both credentials:
  #
  #   publish  -> the Cloudflare API token, and NO `id-token: write`
  #   sign     -> `id-token: write` (OIDC, for keyless cosign), and NO Cloudflare token
  #
  # `publish` also runs `npx --yes wrangler`, whose dependency CLOSURE is not pinned (#115).
  # Putting the signing steps in that job would have placed an OIDC token inside the one
  # unpinned dependency tree in either workflow. Written as a sibling instead, which costs
  # nothing while the job is still being written and closes #115's second option by
  # construction. `tools/check-deploy-workflow.py` asserts the credential stays in `publish`.
  #
  # ON DEMAND, NOT PER DEPLOY. Every merge to `main` deploys (ADR 0024), and a signed tarball
  # per merge would be noise: dozens of releases nobody asked for, each claiming the weight of
  # a release. This runs only on a manual dispatch with `sign: true`.
  #
  # `needs: [build, publish]`, AND THE SECOND ENTRY IS LOAD-BEARING. ADR 0024's 2026-09-18
  # amendment records this finding in full, under "`needs: [build, publish]` is not incidental";
  # read it before changing this line. The release notes assert a
  # deploy-time attestation -- that the live origin served exactly these bytes. With `needs:
  # build` alone the two jobs run in parallel and that sentence is published whether or not
  # `publish` ever succeeded: a blocked `production` environment, a failed round-trip gate, a
  # failed `check-live-routes.py`, or a failed wrangler install all leave the claim standing and
  # false. The interesting half of the claim was the fail-open half. Serialising costs a few
  # minutes and nothing else -- `needs` does not transfer permissions, so the credential split is
  # untouched, and both jobs still consume the same artifact.
  #
  # `github.ref` IS CONSTRAINED for a reason that is not obvious. Keyless signing binds the
  # certificate to `.github/workflows/deploy.yml@<GITHUB_REF>`, and a dispatch may name any
  # branch. Signed from `refs/heads/feature-x`, the certificate says `feature-x`, the published
  # notes say `main`, and the verification command fails for every reader who runs it.
  sign:
    name: sign and publish the payload
    needs: [build, publish]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.sign
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
      id-token: write # cosign keyless signing via OIDC -- NOT granted to `publish`
    steps:
      # NO CHECKOUT OF THE WORKING TREE FOR THE PAYLOAD. `dist/` comes from the artifact, the
      # same one `publish` uploads. The checkout is for the notes check below and nothing else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the payload that was deployed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-dist
          path: payload

      # THE SAME STANDARD THE SIBLING APPLIES. `publish` re-runs this on the downloaded artifact
      # because the round trip is a place bytes go missing -- a dropped `_headers` is the whole
      # response-header policy. Without it here the two siblings disagree about whether the same
      # artifact is acceptable, and only one of them is allowed to say no: `publish` would refuse
      # and deploy nothing while this job signed the broken payload and published notes saying it
      # had been deployed.
      - name: The payload this will sign is the payload that passed the gate
        run: tools/check-deployable-build.sh "$BURROW_SITE" payload

      # DETERMINISTIC, so the tarball is a function of the payload and not of the machine that
      # packed it. Sorted names, fixed owner, fixed mtime from the commit, no gzip timestamp
      # (without `-n` gzip records the pack time in the header), and NORMALISED MODES.
      #
      # The modes are the one a review had to measure. `tar` records permission bits, the
      # artifact v4 zip does not carry POSIX modes, so `download-artifact` recreates them under
      # the RUNNER'S UMASK -- making the archive a function of the host at download time, which
      # is exactly what this step claims it is not. Two identical payloads packed under `umask
      # 022` and `umask 002` produced different digests; with `--mode` they produce the same one.
      # That matters for the third party this determinism exists for: reconstructing the archive
      # on a machine with a different umask would otherwise look like tampering.
      - name: Pack it, reproducibly
        id: pack
        run: |
          set -euo pipefail
          tag="deploy-$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)"
          # BEFORE ANYTHING EXPENSIVE. Re-dispatching the same commit on the same day collides
          # with its own previous tag, and `gh release create` would fail several steps later,
          # after signing, with a message about tags in the middle of cosign output.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::the tag $tag already exists; this commit was already released" >&2
            exit 1
          fi
          archive="burrow-web-$tag.tar.gz"
          mtime="$(git log -1 --format=%cI)"
          tar --format=gnu --sort=name --owner=0 --group=0 --numeric-owner \
            --mode='go-w,a+rX' --mtime="$mtime" \
            -C payload -cf - . | gzip -n -9 > "$archive"
          # PACKED TWICE AND COMPARED. "Reproducibly" was a claim about flags; this makes it a
          # measurement on the runner, which is this repository's standard for a claim. It is one
          # extra pack of a few megabytes.
          tar --format=gnu --sort=name --owner=0 --group=0 --numeric-owner \
            --mode='go-w,a+rX' --mtime="$mtime" \
            -C payload -cf - . | gzip -n -9 > second.tar.gz
          cmp "$archive" second.tar.gz
          rm second.tar.gz
          echo "packed twice, byte-identical"
          sha256sum "$archive" | tee "$archive.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # KEYLESS, AND THE TRANSPARENCY LOG IS ACCEPTED KNOWINGLY. `cosign sign-blob` without a
      # key writes an entry to Rekor recording the repository, the commit SHA, the workflow
      # file, the ref and the trigger. For a public repository whose deploys are already public
      # that discloses nothing new, and it is what makes the signature verifiable by someone who
      # holds no key of ours -- which is the entire point of signing a public artifact.
      - name: Sign the archive
        run: |
          set -euo pipefail
          cosign sign-blob --yes "${{ steps.pack.outputs.archive }}" \
            --output-signature "${{ steps.pack.outputs.archive }}.sig" \
            --output-certificate "${{ steps.pack.outputs.archive }}.pem"

      # RUN THE COMMAND WE ARE ABOUT TO PUBLISH, BEFORE PUBLISHING IT. The notes' WORDING is
      # gated on every CI run; without this step the notes' TRUTH is gated nowhere, and the
      # failure it catches is the worst one available here -- a certificate whose identity does
      # not match the instruction shipped beside it, discovered by the first reader who tries.
      # Emitted from `check-release-notes.py` rather than retyped, so this is character for
      # character the command the release carries; a second copy is the copy that rots.
      - name: Verify the signature the way the notes tell a reader to
        run: |
          set -euo pipefail
          python3 tools/check-release-notes.py --verify-command \
            --archive "${{ steps.pack.outputs.archive }}" > verify.sh
          cat verify.sh
          bash verify.sh

      # THE NOTES CARRY THE VERIFICATION COMMAND, FILLED IN. A signature a reader cannot check
      # without first learning cosign's identity flags is a signature most readers will not
      # check. `tools/check-release-notes.py` generates the text and is the single definition of
      # what the claim says; the step after publishing reads the notes back off the release and
      # fails if they do not carry it.
      - name: Write the release notes
        run: |
          python3 tools/check-release-notes.py --write notes.md \
            --archive "${{ steps.pack.outputs.archive }}" \
            --tag "${{ steps.pack.outputs.tag }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.pack.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Web payload ${{ steps.pack.outputs.tag }}" \
            --notes-file notes.md \
            "${{ steps.pack.outputs.archive }}" \
            "${{ steps.pack.outputs.archive }}.sha256" \
            "${{ steps.pack.outputs.archive }}.sig" \
            "${{ steps.pack.outputs.archive }}.pem" \
            sbom/burrow.cdx.json

      # READ THE STATE BACK. `gh release create` prints warnings and still exits 0, and CLAUDE.md
      # records three measured cases of a green exit over something that had not happened. The
      # notes that matter are the PUBLISHED ones, not the file that was passed in.
      - name: The published notes carry the verification command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ steps.pack.outputs.tag }}" \
            --json body,targetCommitish,isDraft > release.json
          python3 -c '
          import json, sys
          release = json.load(open("release.json"))
          open("published.md", "w").write(release["body"])
          # `--target` IS A REQUEST, NOT A FACT. GitHub ignores `target_commitish` when the tag
          # already exists, and this tag name is derivable from any public commit -- so a tag
          # pushed ahead of time would produce a release whose tag points elsewhere while the
          # notes and the certificate describe the artifact commit. Read back, not assumed.
          want = sys.argv[1]
          if release["targetCommitish"] != want:
              raise SystemExit(
                  f"the release points at {release[\"targetCommitish\"]}, not {want} -- "
                  f"the tag already existed and GitHub kept it where it was"
              )
          if release["isDraft"]:
              raise SystemExit("the release was created as a draft; nobody can fetch it")
          ' "${{ github.sha }}"
          python3 tools/check-release-notes.py --check published.md \
            --archive "${{ steps.pack.outputs.archive }}" \
            --tag "${{ steps.pack.outputs.tag }}"
