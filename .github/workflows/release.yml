name: Release

# STUB — deliberately not wired up yet.
#
# CORRECTED 2026-09-18. This said "there is nothing to release AS A DOWNLOADABLE ARTIFACT ...
# nobody fetches a tarball, so there is nothing for a signature to attach to". That argument was
# sound and it is no longer the situation: `deploy.yml`'s `sign` job packs the deployed payload
# into a tarball on demand and signs it, so the web half has both an artifact and a signature.
#
# What is still absent is the thing THIS file is for: binaries a person downloads and installs,
# which M3/M4 produce and which do not exist yet. The web app is still uploaded byte-for-byte
# from CI to Cloudflare Pages (ADR 0024) and nobody has to fetch the tarball to use the site --
# the tarball is evidence, not a distribution channel.
#
# The header said "pre-alpha (M0) with no working operations" until 2026-09-16, which stopped
# being true without anybody noticing, because a stub's comment is the last thing a reader
# checks. The BEHAVIOUR below was correct throughout; only this description had rotted.
#
# This file exists to record the intended shape of the release pipeline, so the decisions get
# made before there is pressure to ship. `docs/ROADMAP.md` records when the two conditions
# below stop being deferrable: M3/M4 produce binaries a person installs, and a tagged release
# of the core crates is a supply chain whether or not we cut a tarball.
#
# UPDATED 2026-09-18. Two things had to be true before this was enabled. The first is now done
# and the second has MOVED rather than been met -- which is a different thing and is said as
# such, because a stub whose preconditions quietly stop applying is a stub nobody re-reads.
#
#   1. SBOM generation. DONE. `tools/make-sbom.py` generates `sbom/burrow.cdx.json` from the
#      locked Rust workspace AND `engines/licenses.toml`, and CI verifies it on every run
#      against symbol inspection of the shipped binaries. It does NOT use `cargo-cyclonedx`:
#      `cargo metadata` already carries everything needed, and adding a tool to describe your
#      supply chain is itself a supply-chain change. There is no `tools/sbom-merge.sh` and
#      there never was -- the merge happens inside the generator.
#
#   2. Signed artifacts. MOVED, not met. The web payload is signed on demand by the `sign`
#      job in `deploy.yml`, as a sibling of `publish` consuming the same `production-dist`
#      artifact: cosign keyless, `id-token: write`, and NO Cloudflare credential in that job.
#      That covers the thing that exists today. What is still owed HERE is the M3/M4 case --
#      binaries a person installs -- and the core crates, which are a supply chain whether or
#      not we cut a tarball.
#
# Until then: `workflow_dispatch` only, and it fails fast rather than producing an
# unsigned, un-SBOM'd artifact that someone might mistake for a release.

on:
  workflow_dispatch:
  # Enable when the checklist above is satisfied:
  # push:
  #   tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  guard:
    name: not ready
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release
        run: |
          echo "Release pipeline is a stub. See the comment at the top of this file" >&2
          echo "and docs/ROADMAP.md before enabling it." >&2
          exit 1

  # ---------------------------------------------------------------------------------
  # Everything below is the planned shape, kept disabled via `if: false` so it is
  # readable and reviewable without being runnable.
  # ---------------------------------------------------------------------------------

  # NO LONGER A SKETCH. This job used to plan `cargo install cargo-cyclonedx`, `cargo cyclonedx`
  # and a `tools/sbom-merge.sh` that was never written. All three are superseded: the SBOM is
  # generated and verified by `tools/make-sbom.py`, committed at `sbom/burrow.cdx.json`, and
  # checked in CI on every run rather than produced at release time. A release attaches the
  # committed file -- which is the one CI verified -- instead of generating a second one nobody
  # checked.
  sbom:
    name: SBOM
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # - run: python3 tools/make-sbom.py --check   # needs the vendor tree; see ci.yml's test job
      # - uses: actions/upload-artifact@... # pin by SHA when enabled
      - run: echo "planned; see file header"

  # THE MATRIX IS A SKETCH, NOT A PLAN. Six targets are listed below and NONE of them has ever
  # been built by this repository: M1 builds wasm and the host arch, and the Android and Apple
  # targets belong to M3/M4, which have not started. Left in place because the shape is the
  # useful part of a stub, and labelled because an unqualified matrix reads as a decision that
  # was taken.
  build:
    name: build ${{ matrix.target }}
    if: false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: wasm32-unknown-unknown, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-linux-android, os: ubuntu-latest }
          - { target: armv7-linux-androideabi, os: ubuntu-latest }
          - { target: aarch64-apple-ios, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "planned; see file header"

  sign:
    name: sign and publish
    if: false
    needs: [sbom, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # - uses: sigstore/cosign-installer@...   # pin by SHA when enabled
      # - name: Sign artifacts and SBOM
      #   run: |
      #     for f in artifacts/*; do cosign sign-blob --yes "$f" \
      #       --output-signature "$f.sig" --output-certificate "$f.pem"; done
      # - name: Publish release with checksums, signatures, and SBOM
      #   run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag
      - run: echo "planned; see file header"
