name: CI

# Every job here has a local equivalent documented in CLAUDE.md. If it fails here it
# fails there; nothing in CI is a surprise.
#
# All actions are pinned by commit SHA, not tag: a tag can be moved, and this workflow
# has repository write context. Update them deliberately, with the version in the comment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI is not the place to discover a slow incremental build.
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  # NOTE: if .cargo/config.toml ever gains a `rustflags` table, this env var must go --
  # cargo does not merge them, it DISCARDS the tables. That silently dropped an rpath
  # once already.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # clippy RUNS BUILD SCRIPTS, and --all-features turns on `native-engines`, whose
      # build.rs fails when the vendored libraries are absent. So this job needs the
      # engines even though it never links. Same cache key as `test`, so on a warm cache
      # this is a restore rather than a rebuild.
      #
      # Dropping --all-features instead would leave link_check.rs -- the only code in the
      # project with `unsafe` -- unlinted, which is the wrong trade.
      - name: Cache vendored engines
        id: engines-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engines/vendor
          key: engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engines/pins.toml', 'engines/fetch.sh', 'engines/build-native.sh') }}
      - name: Fetch and build engines
        if: steps.engines-cache.outputs.cache-hit != 'true'
        run: |
          engines/fetch.sh
          engines/build-native.sh

      # --all-targets covers tests and benches, where the panic lints are relaxed but
      # everything else still applies.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The engines are a real build input from M1 PR 1 onward: `--all-features` turns on
      # `native-engines`, which links libpdfium.so and libqpdf.a. Cached on the pin
      # manifest and the build scripts, so an ordinary PR does not rebuild qpdf.
      - name: Cache vendored engines
        id: engines-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engines/vendor
          key: engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engines/pins.toml', 'engines/fetch.sh', 'engines/build-native.sh') }}

      # The `qpdf` CLI, which two leak tests need to decompress output before scanning it.
      # NOT assumed present: `secret_leak.rs` has depended on it implicitly, and a scan that
      # cannot decompress reports silence rather than failing -- the exact shape ADR 0019's
      # third correction was about. Installed and then asserted, so "it was on the image" is
      # never the reason a leak test passed.
      - name: Install the qpdf CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf
          command -v qpdf || { echo "::error::qpdf is not on PATH after install" >&2; exit 1; }
          echo "qpdf: $(qpdf --version | head -1)"

      - name: Fetch and build engines
        if: steps.engines-cache.outputs.cache-hit != 'true'
        run: |
          engines/fetch.sh
          engines/build-native.sh

      # A cache hit restores engines/vendor without running fetch.sh, so re-verify the
      # checksums rather than trusting the cache. build.rs checks libpdfium.so too; this
      # covers the source tarballs as well.
      - name: Re-verify engine checksums
        run: engines/fetch.sh

      # burrow-engines' own binary carries an absolute DT_RPATH into engines/vendor,
      # emitted by its build.rs. That is the binary the provenance test runs in, so if
      # the rpath goes missing the test could start passing against a system library.
      # Assert it directly -- this breakage is invisible until something runs.
      - name: Assert burrow-engines carries a DT_RPATH into engines/vendor
        run: |
          cargo test -p burrow-engines --all-features --no-run 2>/dev/null
          found=0
          for bin in target/debug/deps/burrow_engines-*; do
            case "$bin" in *.d) continue ;; esac
            [ -x "$bin" ] || continue
            found=1
            if ! readelf -d "$bin" | grep -E 'RPATH' | grep -q 'engines/vendor'; then
              echo "::error::$bin has no DT_RPATH into engines/vendor" >&2
              readelf -d "$bin" | grep -E 'NEEDED|RPATH|RUNPATH' >&2
              exit 1
            fi
          done
          [ "$found" = 1 ] || { echo "::error::no burrow_engines test binary found" >&2; exit 1; }
          echo "burrow-engines carries the pinned rpath"

      - run: cargo test --workspace --all-features

      # The native half of the differential conformance harness (ROADMAP item 12). Written by
      # `tests/conformance.rs` during the run above; the `web` job downloads it and diffs it
      # against what the browsers produced for the same corpus.
      #
      # An artifact rather than recomputing it in the `web` job, because the native side needs
      # the NATIVE engines and the web job has only the wasm ones. Both engine sets stay on
      # their existing caches; neither is built twice.
      #
      # `if-no-files-found: error` matters more than it looks: a missing record would otherwise
      # reach the web job as "nothing to compare", which is exactly the shape of a differential
      # harness that has stopped comparing.
      - name: Upload the native conformance record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-conformance-record
          path: tests/conformance/native-outcomes.json
          if-no-files-found: error
          retention-days: 1

      # The engine tests are the riskiest part of the suite and are feature-gated, so a
      # misconfiguration could silently drop them and still show green. Assert on
      # IDENTITY, not on a count: a threshold would start passing the moment PR 2 adds
      # engine-independent unit tests to this crate.
      - name: Assert the engine link tests actually ran
        run: |
          list=$(cargo test -p burrow-engines --all-features -- --list)
          echo "$list"
          # TWO GROUPS, because they prove different things and conflating them weakened the
          # check. Three names below moved in M1 PR 4a-i, when the error tables were hoisted
          # out of the native-engines cfg gate so the web path could share them -- and simply
          # renaming them here would have left this step listing UNGATED tests, which say
          # nothing at all about whether `native-engines` took effect.
          #
          # Group 1: GATED. These exist only when the engines are linked, so their presence is
          # the actual evidence this step is named for.
          for t in \
            link_check::tests::the_loaded_pdfium_is_the_pinned_library \
            link_check::tests::pdfium_links_and_initialises_cleanly \
            link_check::tests::qpdf_links_and_reports_the_pinned_version \
            pdfium::tests::a_valid_document_opens_and_reports_its_pages \
            pdfium::tests::an_encrypted_document_with_no_password_needs_one \
            qpdf::tests::every_failure_path_returns_a_typed_error_rather_than_unwinding
          do
            printf '%s' "$list" | grep -q "^$t: test$" || {
              echo "::error::$t was not discovered. Is native-engines taking effect?" >&2
              exit 1
            }
          done
          echo "gated engine tests present"

          # Group 2: UNGATED, and listed anyway. These are the named traps -- PDFium's `-0`
          # sentinel reading as success (ADR 0006 requirement 6), qpdf's `QPDF_ERROR_CODE`
          # bitmask, and the pre-scan's cycle bound. They now run on every target, which is
          # the point of hoisting them, but they are the ones whose disappearance would be
          # quietest and most expensive, so their names are pinned here too.
          for t in \
            codes::pdfium::tests::a_zero_error_code_on_a_failed_call_is_never_success \
            codes::qpdf::tests::a_zero_code_on_a_failed_call_is_never_success \
            codes::qpdf::tests::warnings_alone_are_not_an_error \
            prescan::xref::tests::a_prev_chain_pointing_at_itself_terminates
          do
            printf '%s' "$list" | grep -q "^$t: test$" || {
              echo "::error::$t was not discovered. It is ungated, so this is not a feature" >&2
              echo "::error::  problem -- the test was renamed, moved, or deleted." >&2
              exit 1
            }
          done
          echo "named-trap tests present"

      # The integration tests are separate binaries with their own cfg gate, so the check
      # above says nothing about them. These are the ones that would silently vanish and
      # take the most important guarantees with them: that the serialisation holds, that
      # the roadmap's named limits are enforced, and that the shared conformance corpus is
      # actually exercised.
      - name: Assert the integration tests actually ran
        run: |
          # PER CRATE, because the suites live in two of them since M1 PR B2: `conformance`
          # moved to burrow-ops when the corpus grew an OPERATION, and `merge` was born
          # there. Naming a suite under the wrong crate is an immediate hard failure --
          # "no test target named `conformance` in `burrow-engines`" -- which is how this
          # step found out.
          run_suites() {
            crate="$1"; shift
            for suite in "$@"; do
              list=$(cargo test -p "$crate" --all-features --test "$suite" -- --list)
              printf '%s' "$list" | grep -q ': test$' || {
                echo "::error::$crate's $suite suite discovered no tests. Is native-engines taking effect?" >&2
                exit 1
              }
              echo "$crate/$suite: $(printf '%s' "$list" | grep -c ': test$') tests"
            done
          }
          engines_suites="parallelism limits properties structure secret_leak prescan"
          ops_suites="conformance merge reorder reorder_keeps_everything rotate rotate_keeps_everything split split_no_leak subset_closure"
          run_suites burrow-engines $engines_suites
          run_suites burrow-ops $ops_suites

          # AND THE LIST ITSELF IS CHECKED, because it is hand-maintained and this step
          # exists precisely to stop a suite going unrun. A new `tests/*.rs` that nobody
          # added above would be covered by nothing -- the same shape as a fuzz target
          # declared and never run, which this workflow now also guards.
          named=$(printf '%s %s' "$engines_suites" "$ops_suites" | tr ' ' '\n' | grep -v '^$' | sort -u)
          on_disk=$(find core/*/tests -maxdepth 1 -name '*.rs' -printf '%f\n' \
                    | sed 's/\.rs$//' | sort -u)
          echo "named:   $(printf '%s' "$named" | tr '\n' ' ')"
          echo "on disk: $(printf '%s' "$on_disk" | tr '\n' ' ')"
          missing=$(comm -13 <(printf '%s\n' "$named") <(printf '%s\n' "$on_disk"))
          if [ -n "$missing" ]; then
            echo "::error::integration suites on disk but not named in this step: $missing" >&2
            exit 1
          fi
          echo "OK -- every integration suite on disk is named and ran"

      # The two tests that are `#[ignore]`d BECAUSE THEY FAIL, run on purpose and required to
      # fail. Without this, "the gap is visible in the suite" is a claim about a doc comment:
      # `cargo test` never runs an ignored test, so they would be comments containing
      # `assert!`. ADR 0019 SS2a records six channels through which `split` still carries data
      # from excluded pages; these are the assertions that say so, and the day issue #54
      # accidentally lands, THIS step is what notices -- by going green where it must be red.
      #
      # Same shape as tools/test-check-qpdf-crypto.sh: a check whose subject is a failure.
      - name: The known-unmet subsetting rule is still unmet, and says so
        run: |
          set -u
          expected="split_no_leak::no_output_carries_anything_from_a_page_it_excluded_even_when_objects_are_shared
          subset_closure::every_surviving_object_belongs_to_a_page_the_output_contains"
          failed=0
          for suite_test in $expected; do
            suite=${suite_test%%::*}
            name=${suite_test##*::}
            echo "--- $suite::$name (expected to FAIL)"
            if cargo test -p burrow-ops --all-features --test "$suite" -- --ignored --exact "$name" >/tmp/ignored.log 2>&1; then
              echo "::error::$suite::$name PASSED. Either issue #54 is fixed -- in which case remove the #[ignore], delete the companion 'the gap still exists' test and amend ADR 0019 SS2a -- or the test has stopped measuring anything." >&2
              tail -20 /tmp/ignored.log >&2
              exit 1
            fi
            # It must fail for the RIGHT reason: a compile error or a missing fixture fails too.
            grep -q "belonging only to pages it excluded\|carries data derived from excluded pages" /tmp/ignored.log || {
              echo "::error::$suite::$name failed for a reason other than the leak it exists to record." >&2
              tail -20 /tmp/ignored.log >&2
              exit 1
            }
            failed=$((failed + 1))
            echo "    failed as required"
          done
          [ "$failed" -eq 2 ] || { echo "::error::expected 2 known-unmet tests, ran $failed" >&2; exit 1; }
          echo "OK -- $failed known-unmet test(s) failed as required; the gap is measured, not asserted"

      # The other kind of ignored test: a REPRODUCTION, required to pass.
      #
      # The step above runs ignored tests that must FAIL, because they assert a rule the code
      # does not yet meet. This one runs ignored tests that must PASS, because they assert the
      # defective behaviour exactly as it is -- so the day the defect is fixed, or moves, this
      # step goes red and says which issue needs re-measuring. An ignored test nobody runs is
      # a comment containing `assert!`, whichever direction it points in.
      #
      # #61: a damaged-but-openable document loses a page on write, on every operation
      # including `rotate`, which has shipped. Found by fuzzing `reorder`; not reorder's.
      - name: Known-defect reproductions still reproduce
        run: |
          set -u
          expected="reorder_keeps_everything::a_damaged_document_loses_pages_on_write"
          ran=0
          for suite_test in $expected; do
            suite=${suite_test%%::*}
            name=${suite_test##*::}
            echo "--- $suite::$name (expected to PASS, because it reproduces a defect)"
            if ! cargo test -p burrow-ops --all-features --test "$suite" -- --ignored --exact "$name" >/tmp/repro.log 2>&1; then
              echo "::error::$suite::$name no longer reproduces. Either the defect is fixed -- in which case turn this into a positive test, close the issue it names and move the fixture into the conformance corpus -- or the behaviour has moved and the issue needs re-measuring." >&2
              tail -20 /tmp/repro.log >&2
              exit 1
            fi
            ran=$((ran + 1))
            echo "    reproduced as required"
          done
          [ "$ran" -eq 1 ] || { echo "::error::expected 1 reproduction, ran $ran" >&2; exit 1; }
          echo "OK -- $ran known-defect reproduction(s) still reproduce"

      # Asks the question check-engine-licences.py cannot: is every component we can
      # DETECT in the artifacts actually declared? That is how HarfBuzz went undeclared
      # through a whole ADR cycle. Lives here because it needs the built artifacts.
      - name: Detect undeclared engine components (ADR 0010)
        run: |
          python3 tools/detect-engine-components.py
          tools/test-detect-engine-components.sh

      # ROADMAP M1 item 3's second half: "CI fails if ... `QPDFCrypto_gnutls` appears in
      # the link". Only the first half existed -- `engines/build-native.sh` greps qpdf's
      # CMake configure summary, which says what CMake DECIDED, not what reached the archive.
      #
      # And that grep lives inside the build step, which is gated on a cache miss. On an
      # ordinary PR the cache hits, the build does not run, and the crypto assertion did not
      # run either. This step is deliberately UNGATED: it reads the artifact, so it works on
      # a restored cache. Same reasoning as "Re-verify engine checksums" above.
      #
      # GnuTLS is LGPL-2.1-or-later and qpdf links it by default (ADR 0008). Nothing else in
      # this repository would catch it: cargo-deny sees Rust crates, and engines/licenses.toml
      # is hand-maintained and would simply not mention it.
      - name: qpdf links native crypto only, never GnuTLS (ROADMAP item 3, ADR 0008)
        run: tools/check-qpdf-crypto.sh

      # The licence-copy DRIFT check, which needs the vendor tree and therefore cannot run in
      # the `deny` job where the rest of this script runs.
      #
      # `check-engine-licences.py` compares each committed text under engines/licences/ against
      # the audited original under engines/vendor/ byte for byte -- but only when the vendor
      # tree is present, and it skips silently otherwise so it stays runnable on a clean
      # checkout. The `deny` job fetches nothing, so in CI that comparison was firing for ZERO
      # components: the allowlist half was gated and the drift half was local-only. Running it
      # again here, where the engines exist, is what makes engines/licences/README.md's claim
      # true. Both runs are cheap and neither subsumes the other.
      - name: Engine licence texts have not drifted from the vendor originals (ADR 0008)
        run: |
          python3 tools/check-engine-licences.py
          # The self-test HERE, not in `deny`: its architecture-wildcard case needs a
          # vendor/native-* tree to fall back to, and `deny` fetches nothing. Same placement
          # rule as the drift comparison above, for the same reason.
          tools/test-check-engine-licences.sh

      # The OTHER half of the qpdf exception audit. engines/build-wasm.sh already checks
      # the built module's export table against ffi.rs; this checks ffi.rs against qpdf's
      # OWN SOURCE -- the set of functions actually routed through `trap_errors`.
      #
      # Here because engines/vendor/ is gitignored and this job has already fetched it.
      # Regenerating and diffing, rather than trusting the committed list: upstream can
      # stop routing a function through the helper without changing its signature, and a
      # committed list nobody re-derives would keep saying it was safe. A stale list is a
      # failure, not a warning.
      - name: qpdf trapped-function list is current (ADR 0013 §1)
        run: |
          cp engines/qpdf-trapped-functions.txt "$RUNNER_TEMP/committed.txt"
          cp engines/qpdf-proven-helpers.toml "$RUNNER_TEMP/committed-helpers.toml"
          # NO --accept-helper-changes here, ever. --generate REFUSES when a proven helper's
          # body has moved, and that refusal IS the check: a qpdf bump that restructures
          # `trap_oh_errors` or `do_with_oh` has to be re-read by a person before the trapped
          # set can be rebuilt on it. Passing the flag in CI would automate away the one step
          # that is deliberately manual.
          python3 tools/check-qpdf-trapped.py --generate
          diff -u "$RUNNER_TEMP/committed.txt" engines/qpdf-trapped-functions.txt || {
            echo "::error::engines/qpdf-trapped-functions.txt is stale. Regenerate it with" \
                 "python3 tools/check-qpdf-trapped.py --generate and commit the result." >&2
            exit 1
          }
          diff -u "$RUNNER_TEMP/committed-helpers.toml" engines/qpdf-proven-helpers.toml || {
            echo "::error::engines/qpdf-proven-helpers.toml is stale. See 'Bumping an engine" \
                 "pin' in engines/pins.toml -- the helper bodies the proof was read against" \
                 "have moved." >&2
            exit 1
          }

      - name: doc tests and rustdoc warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nightly, because cargo-fuzz requires it. Pinned toolchain files do not apply:
      # fuzz/ is its own workspace, excluded from the root one.
      # Same pinned action as every other job (its `stable` branch); the `toolchain`
      # input below is what selects nightly, which cargo-fuzz requires.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      # Same cache key as the test and clippy jobs, so this is a restore on a warm cache.
      - name: Cache vendored engines
        id: engines-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engines/vendor
          key: engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engines/pins.toml', 'engines/fetch.sh', 'engines/build-native.sh') }}

      - name: Fetch and build engines
        if: steps.engines-cache.outputs.cache-hit != 'true'
        run: |
          engines/fetch.sh
          engines/build-native.sh

      - name: Re-verify engine checksums
        run: engines/fetch.sh

      # cargo-fuzz takes a couple of minutes to build and this job is in the required
      # `ci` gate, so every PR would pay for it. Keyed on the version, so a bump
      # invalidates the cache rather than silently keeping the old binary.
      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-0.13.2

      - if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.13.2 cargo-fuzz

      # 60 seconds per PR. The 10-minute run is nightly, in fuzz-nightly.yml; longer runs
      # come with the self-hosted GB10 runner.
      #
      # -timeout and -rss_limit_mb are REQUIRED, not tuning. Limits::max_duration_ms is
      # checkpoint-based (ADR 0007) and cannot catch a hang inside a single engine call,
      # so libFuzzer's own timeout is the only thing that can.
      #
      # LD_LIBRARY_PATH because `cargo fuzz run` execs the binary directly rather than
      # through cargo, so it does not get the deps/ path cargo adds for `cargo test`.
      # ASAN_OPTIONS because FPDF_DestroyLibrary is deliberately never called, so PDFium's
      # statics are live at exit by design. Both are explained in fuzz/README.md.
      # SEED THE CORPORA FIRST, and this is not a nicety.
      #
      # `fuzz/corpus/` is gitignored and nothing here had ever shipped a seed set, so every
      # "clean for 60 s" this project recorded was measured against a corpus libFuzzer had
      # grown from random bytes -- and libFuzzer does not invent a valid PDF. Measured, with a
      # defect planted in `reorder` that made the permutation do nothing: 577,209 unseeded
      # executions found nothing, and one seed failed on the first execution.
      #
      # The seeder does arithmetic for `merge`, whose split offset is derived from bytes that
      # are themselves part of the first document -- without it that target never sees two
      # real documents at all. It verifies every seed decodes back to its fixture before
      # writing, and refuses if a target's input layout has drifted from its table.
      - name: Seed every corpus from the committed fixtures
        run: |
          python3 tools/seed-fuzz-corpus.py
          tools/test-seed-fuzz-corpus.sh

      - name: fuzz document_open and prescan for 60s each
        working-directory: fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/engines/vendor/native-$(uname -m)/lib"
          for target in document_open prescan; do
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          done

      # qpdf is built FROM SOURCE, so unlike PDFium it can be instrumented -- and
      # `engines/build-native.sh` produces a second archive with
      # `-fsanitize=fuzzer-no-link,address` for exactly this. The RUSTFLAGS override is
      # what selects it; without it this would link the plain archive and libFuzzer would
      # see nothing inside qpdf at all.
      #
      # THIS STEP IS ALSO A MEASUREMENT. M1 PR 2 established that clang 18's ASan runtime
      # in that archive links with cargo-fuzz's Rust ASan -- on aarch64 only. CI is
      # x86-64. If this step fails to link here, that is the answer to the open question,
      # and the target moves to the self-hosted arm64 runner with the decision recorded
      # rather than worked around. See fuzz/README.md.
      - name: fuzz the qpdf operations for 60s each, against the instrumented archive
        working-directory: fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/engines/vendor/native-$(uname -m)/lib"
          export RUSTFLAGS="-L native=$GITHUB_WORKSPACE/engines/vendor/native-$(uname -m)/lib/fuzz"
          for target in qpdf_check rotate reorder; do
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          done

      # `merge` and `split`, QUARANTINED, and the quarantine is the honest part.
      #
      # Seeded with real documents, both reproduce defects that are open right now:
      #
      #   * `split` loses a page on a damaged-but-openable document and its own partition
      #     assertion catches it -- #61, which is a ship blocker. Note it goes through the
      #     BUILD route rather than the write path, so #61 is broader than it first looked.
      #   * `merge` hits a second use-after-free in qpdf's foreign-object copier, distinct
      #     from the open-path one and reached from `qpdf_add_page` -- #62, disclosed
      #     privately upstream.
      #
      # Neither is burrow's to fix today, and neither is a reason to stop running them. What
      # would be wrong is either extreme: gating every pull request on a known-open upstream
      # bug, or quietly unseeding these two so the job goes green while measuring nothing.
      #
      # So they run UNSEEDED here -- which is what they did before, no worse -- and seeded for
      # ten minutes in fuzz-nightly.yml, where a crash is a report rather than a blocked merge.
      # When #61 and #62 close, these two move back into the loop above and this step goes.
      - name: fuzz merge and split for 60s each, unseeded pending #61 and #62
        working-directory: fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/engines/vendor/native-$(uname -m)/lib"
          export RUSTFLAGS="-L native=$GITHUB_WORKSPACE/engines/vendor/native-$(uname -m)/lib/fuzz"
          for target in merge split; do
            rm -rf "corpus/$target"
            mkdir -p "corpus/$target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          done

      # EVERY TARGET IN fuzz/Cargo.toml MUST BE NAMED IN A STEP ABOVE, and nothing enforced
      # that until M1 PR B added one. The steps list targets explicitly -- which is right,
      # because they need different RUSTFLAGS -- so a new `[[bin]]` runs nowhere and the job
      # still passes. A fuzz target that never runs is the "silently examines nothing" shape
      # the root CLAUDE.md names, in the suite whose whole job is to find what tests do not.
      - name: Every fuzz target is actually run by this job
        working-directory: fuzz
        run: |
          declared=$(cargo +nightly fuzz list | sort)
          run=$(grep -ohE 'for target in [a-z_ ]+' ../.github/workflows/ci.yml \
                | sed 's/for target in //' | tr ' ' '\n' | grep -v '^$' | sort -u)
          # AND THE NIGHTLY MATRIX, which this guard did not read. `merge`, `split`, `rotate`
          # and `reorder` were all absent from fuzz-nightly.yml -- four targets the long run
          # had never touched -- while this step reported every declared target as covered.
          # A guard that checks one of two places is the shape it exists to prevent.
          nightly=$(sed -n '/^        target:/,/^    steps:/p' ../.github/workflows/fuzz-nightly.yml \
                | grep -oE '^ *- [a-z_]+$' | tr -d ' -' | sort -u)
          echo "declared: $(echo "$declared" | tr '\n' ' ')"
          echo "run:      $(echo "$run" | tr '\n' ' ')"
          echo "nightly:  $(echo "$nightly" | tr '\n' ' ')"
          missing=$(comm -23 <(echo "$declared") <(echo "$run"))
          if [ -n "$missing" ]; then
            echo "::error::fuzz targets declared but never run in this job: $missing"
            exit 1
          fi
          absent=$(comm -23 <(echo "$declared") <(echo "$nightly"))
          if [ -n "$absent" ]; then
            echo "::error::fuzz targets missing from the nightly matrix: $absent"
            exit 1
          fi
          echo "OK -- all $(echo "$declared" | wc -l) declared target(s) run here and nightly."

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The web app's whole payload rides on this target building.
      #
      # The size budget this comment used to ask for is in the `web` job, not here, and that
      # is the right place: this job builds one .wasm and a user pays for six artifacts. A
      # budget on the Rust module alone would have passed every regression that mattered --
      # it is 0.7% of the payload. See apps/web/size-budget.json.
      - run: cargo build -p burrow-wasm --target wasm32-unknown-unknown --release

  mobile:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      # `check`, not `build`: this needs no Xcode SDK and no Android NDK, so it runs on
      # a Linux runner years before M3/M4 can build the apps. The point is that a core
      # change which breaks a mobile target fails now rather than at the start of M3.
      - run: cargo check --workspace --all-features --target ${{ matrix.target }}

  deny:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job is the enforcement mechanism for ADR 0003. It is not advisory: a
      # non-permissive dependency must not be mergeable.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all
          arguments: --all-features
      # `fuzz/` is EXCLUDED from the root workspace and has its own Cargo.lock, so the
      # check above never saw it -- no fuzz dependency had ever been licence-checked, and
      # libfuzzer-sys entered unnoticed in M1 PR 2. See ADR 0012.
      #
      # `bans` is deliberately not in this list: `wildcards = "deny"` fires on the three
      # burrow-* path dependencies, which is right for a crate we might publish and
      # meaningless for a fuzz harness we never will.
      - name: cargo-deny for the fuzz workspace (ADR 0012)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fuzz/Cargo.toml
          command: check licenses advisories sources
          arguments: --all-features --config deny.toml

      # An independent backstop for non-negotiable #1, deliberately not using cargo-deny.
      # `cargo tree` over every kind and every target, matching names against the same ban
      # list, so the guarantee does not rest on one tool's view of the graph -- which is
      # demonstrably not the lockfile. See the correction at the top of deny.toml.
      - name: No network or TLS crate in any dependency graph
        run: |
          tools/check-no-network-deps.sh
          tools/test-check-no-network-deps.sh

      # cargo-deny sees Rust crates only. The native engines and everything they bundle
      # are the other 82% of the shipped bytes, and they are checked here against
      # ADR 0008's allowlist. Same job on purpose: one gate for the whole graph.
      - name: engine licences (ADR 0008)
        run: python3 tools/check-engine-licences.py

      # Every qpdf C function burrow declares -- natively and on the web -- must be on the
      # generated trapped list or in the justified exemption list. An untrapped call lets a
      # C++ exception cross the FFI boundary, which aborts the process: `qpdf_is_linearized`
      # did exactly that on an ordinary 356-byte PDF. ADR 0013 §1.
      #
      # Here rather than in `test` because it reads only committed files, so it runs on a
      # clean checkout with no engine fetch. The `test` job checks the list is not stale.
      - name: qpdf declarations are all trapped or accepted (ADR 0013 §1)
        run: |
          python3 tools/check-qpdf-trapped.py
          tools/test-check-qpdf-trapped.sh

      # A `qpdf_oh` is a cache key that is fresh on every call, not an object's identity.
      # `reorder` compared two raw handles to ask whether a page was already in place; the
      # comparison was false for every page, so every permutation -- the identity included --
      # failed with `qpdf_e_pages`. That one failed loudly. `split`'s pruning and redaction
      # make the same decision, and the same mistake there prunes nothing and redacts
      # nothing while producing a perfectly valid PDF. ADR 0013's handle-identity amendment.
      #
      # Here, in the job that fetches nothing, because it reads only Rust source -- and it
      # scans untracked files too, since the code being written is exactly where this
      # mistake is made.
      - name: no qpdf handle is used as an object identity (ADR 0013)
        run: |
          python3 tools/check-handle-identity.py
          tools/test-check-handle-identity.sh

      # THE LOCAL RUNNER STILL COVERS THIS FILE.
      #
      # `tools/ci-local.py` runs what CI runs, and refuses to run anything unless every gate
      # in this file is either covered locally or carries an argued exemption. That refusal is
      # only useful if it is kept true, and the person adding a check here is exactly the
      # person who will not think to update it -- so the parity check runs in CI as well, and a
      # new gate with no local counterpart fails on the commit that introduces it.
      #
      # It exists because four CI failures across two batches were each a green local sweep
      # that had skipped a job: `cargo audit`, `check-wasm-exports.sh`, the fuzz target list,
      # and `pnpm check`. `CLAUDE.md` already carried the rule and it did not prevent the next
      # three; a habit that has failed four times is not a control.
      #
      # `--check` only: this job fetches nothing and must not try to run a test suite.
      - name: The local CI runner still covers every gate in this file
        run: |
          python3 tools/ci-local.py --check
          tools/test-ci-local.sh

      # Compile every tool in tools/ with warnings promoted to errors.
      #
      # M1 PR 4c shipped a regex in a non-raw docstring, so `check-qpdf-trapped.py` printed
      # `SyntaxWarning: invalid escape sequence '\.'` on every run and nothing failed. A
      # warning on stderr in a green job is the worst place for one: loud enough to be
      # noise, quiet enough to be ignored, and in a security-critical checker where noise is
      # what stops people reading the output. Python escalates this class to a SyntaxError
      # in a future release, so the eventual break would land on an interpreter upgrade
      # rather than on the commit that caused it.
      - name: Python tools compile with no syntax warnings
        run: python3 tools/check-python-syntax.py

      # Generated output must never be tracked. Twice it reached main while the ignore rule
      # that should have stopped it existed: a `.pyc` in #29, and 24 spike sweep logs in #37,
      # whose rule lived in a BRANCH-LOCAL .gitignore that checking out main removed.
      #
      # Here, in the job that fetches nothing, because it reads only `git ls-files` -- and it
      # scans the whole tracked tree rather than a diff, so it needs no merge base and stays
      # red until the file is actually removed rather than passing forever once something has
      # landed.
      - name: No tracked file is generated output
        run: |
          tools/check-no-generated-files.sh
          tools/test-check-no-generated-files.sh

      # The crypto checker's adversarial self-test, HERE rather than beside the checker in
      # `test`, by the rule in CLAUDE.md: it reads only committed files and needs only cc and
      # ar, so a job that fetches nothing is where it belongs -- and running it on a clean
      # checkout proves the checker works without a vendor tree, which running it next to the
      # artifacts never could.
      #
      # It builds synthetic archives and modules for every way the checker could pass on
      # input it should reject. A mutation sweep over the checker's nine defences leaves one
      # survivor, and that one is documented in the script as subsumed rather than untested.
      - name: The qpdf crypto checker fails on input it should reject
        run: tools/test-check-qpdf-crypto.sh

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # audit-check opens an issue for a new advisory on push to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # INSTALL cargo-audit OURSELVES, PINNED AND `--locked`, BEFORE THE ACTION RUNS.
      #
      # `rustsec/audit-check` shells out to a bare `cargo install cargo-audit` when the binary
      # is not already on PATH — unpinned, and without `--locked`, so it resolves the audit
      # tool's own dependencies to whatever is newest at that moment. On 2026-09-12 that
      # became `jiff 0.2.36`, whose published tarball has `include_str!("../../../../PLATFORM.md")`
      # paths that do not resolve inside the crates.io package:
      #
      #     error: couldn't read .../jiff-0.2.36/src/../../../../PLATFORM.md
      #     error: could not compile `jiff` (lib) due to 4 previous errors
      #     error: failed to compile `cargo-audit v0.22.2`
      #
      # burrow had no advisory and no dependency change; the AUDIT TOOL would not build. Every
      # repository using this action broke at the same moment, which is the point: an unpinned
      # `cargo install` in a required check makes the whole gate depend on the health of a
      # transitive dependency of a tool, and it fails closed on green code.
      #
      # `--locked` uses cargo-audit's OWN Cargo.lock (jiff 0.2.28 here), which is the version
      # its maintainers tested. Verified locally: the same `cargo-audit v0.22.2` installs clean.
      #
      # The action still runs, and still does the part only it can do — opening an issue for a
      # new advisory on push to main, which is why this job holds `issues: write`. It just
      # finds the binary already present and skips its own install.
      #
      # Bump `--version` deliberately. The advisory DATABASE is fetched at run time regardless,
      # so a pinned tool still sees new advisories; what is pinned is the code that reads them.
      - name: Install cargo-audit, pinned and --locked
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Note: this covers Rust crates only. Vendored C/C++ engines (M1) are tracked
      # separately — see ADR 0004 and THIRD_PARTY_NOTICES.md.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: web
    runs-on: ubuntu-latest
    # The differential harness diffs the browsers against the native record, so that record
    # has to exist first. It is the only ordering constraint between the two jobs, and it buys
    # the half of ROADMAP item 12 that a shared expectations file cannot: a divergence in a
    # field nobody thought to put in the schema.
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the native conformance record
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: native-conformance-record
          path: tests/conformance/

      # ---- the wasm engines -------------------------------------------------------
      # New in M1 PR 4a-i. Until now CI never ran engines/build-wasm.sh at all, so the
      # wasm artifacts were only ever built on a developer's machine. The web tests drive
      # real PDFium and real qpdf in a real browser, so they need them here.
      #
      # Cached on the same key shape as the native engine jobs, plus build-wasm.sh and the
      # emsdk version -- emsdk contributes code to the shipped artifact (musl libc,
      # compiler-rt, the JS glue), so a version change must invalidate the cache.
      - name: Cache vendored wasm engines
        id: wasm-engines-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: engines/vendor
          key: wasm-engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('engines/pins.toml', 'engines/fetch.sh', 'engines/build-wasm.sh') }}

      - name: Read the pinned emsdk version and repo commit
        id: emsdk
        run: |
          block="$(sed -n '/^\[emsdk\]/,/^\[/p' engines/pins.toml)"
          version="$(printf '%s' "$block" | sed -n 's/^version = "\(.*\)"/\1/p')"
          commit="$(printf '%s' "$block" | sed -n 's/^repo_commit = "\(.*\)"/\1/p')"
          [ -n "$version" ] || { echo "no emsdk version in engines/pins.toml" >&2; exit 1; }
          [ -n "$commit" ] || { echo "no emsdk repo_commit in engines/pins.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Cache emsdk
        if: steps.wasm-engines-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.emsdk.outputs.version }}

      - name: Install the pinned emsdk
        if: steps.wasm-engines-cache.outputs.cache-hit != 'true'
        env:
          EMSDK_REPO_COMMIT: ${{ steps.emsdk.outputs.commit }}
        run: |
          version="${{ steps.emsdk.outputs.version }}"
          if [ ! -f "$HOME/.local/share/emsdk/emsdk_env.sh" ]; then
            # The SDK VERSION is pinned in engines/pins.toml and asserted by
            # engines/build-wasm.sh; the emsdk repo that installs it was not, which is out
            # of step with everything else under engines/. emsdk verifies the toolchain
            # archive it downloads by sha512, so the exposure is the installer script
            # rather than the compiler -- but the installer runs in CI with the same
            # privileges as the build.
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/.local/share/emsdk"
            git -C "$HOME/.local/share/emsdk" checkout --detach "$EMSDK_REPO_COMMIT"
          fi
          "$HOME/.local/share/emsdk/emsdk" install "$version"
          "$HOME/.local/share/emsdk/emsdk" activate "$version"

      - name: Fetch and build the wasm engines
        if: steps.wasm-engines-cache.outputs.cache-hit != 'true'
        run: |
          engines/fetch.sh
          engines/build-wasm.sh

      # Re-run the artifact checks even on a cache hit. A cache is not a provenance claim:
      # the export allowlist, the crypto flags and the no-async/no-network assertions must
      # hold for the bytes we are about to ship, not for the bytes that were built once.
      - name: Re-verify engine checksums
        run: engines/fetch.sh

      # ON EVERY RUN, WARM CACHE OR COLD -- which is the whole reason this step exists rather
      # than only the call inside build-wasm.sh.
      #
      # The comparison lived in build-wasm.sh, which the step above runs only on a cache MISS,
      # and the cache key is (pins.toml, fetch.sh, build-wasm.sh). `qpdf_remove_page` was
      # declared natively for split in PR #55, never exported, and sat on main undetected
      # because no PR since touched any of those three files. It surfaced only when rotate's
      # branch edited a COMMENT in pins.toml and busted the cache.
      #
      # The comment above already says a cache is not a provenance claim. This is the same
      # point one layer in: a check gated on a cache miss is a check that mostly does not run,
      # and it is the second one in this repository to have hidden a real defect. It reads only
      # committed files plus the cached qpdf.wasm, both present either way.
      - name: qpdf.wasm exports exactly what ffi.rs declares (ADR 0013 §1)
        run: |
          tools/check-wasm-exports.sh
          tools/test-check-wasm-exports.sh

      # ---- the Rust module --------------------------------------------------------
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The wasm half of the same assertion, and it names `qpdf.wasm` -- the LINKED module a
      # user downloads -- not `libqpdf.a`.
      #
      # Two reasons, and the second is why this step is not simply the archive:
      #
      #   * The module is what ships. A library introduced at the emcc link step is invisible
      #     in the archive, and an archive member the linker dropped as unused never reaches
      #     anyone. The shipped bytes are the honest subject.
      #   * Reading a wasm ARCHIVE needs `llvm-nm`; plain `nm` cannot, and emsdk is installed
      #     in this job only on a cache MISS and never exported to PATH. So an archive check
      #     here would fail closed on every warm-cache PR -- correct behaviour, red CI, no
      #     added safety. Scanning the module needs only `strings`, from binutils.
      #
      # The native archives get the full symbol-table treatment in the `test` job.
      - name: qpdf wasm links native crypto only, never GnuTLS (ROADMAP item 3, ADR 0008)
        run: tools/check-qpdf-crypto.sh engines/vendor/wasm/lib/qpdf.wasm

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      # --target no-modules, NOT --target web: the worker is classic (pdfium.js is not
      # modularised and needs importScripts), and a classic worker cannot import an ES
      # module. See apps/web/CLAUDE.md.
      - name: Build the wasm binding
        run: wasm-pack build bindings/burrow-wasm --target no-modules --out-dir pkg --release

      # ---- the web app ------------------------------------------------------------
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      # BEFORE lint and check. `src/generated/engines.js` is generated and gitignored, and
      # `BaseLayout.astro` imports it -- so on a fresh checkout `pnpm check` fails with
      # "Cannot find module '../generated/engines.js'" unless staging has run. Only `pnpm
      # build` runs it automatically (as `prebuild`), and that comes later.
      - name: Stage the engines and generate the CSP
        working-directory: apps/web
        run: pnpm run prebuild
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Type check
        working-directory: apps/web
        run: pnpm check
      - name: Build
        working-directory: apps/web
        run: pnpm build
      # Reports the first-load payload against its budget on every PR, as a step summary.
      #
      # A step summary and not a PR comment: this workflow runs with `permissions:
      # contents: read`, a comment needs `pull-requests: write`, and a token with write
      # access to the repository is not worth adding for a size table. A summary also
      # renders on a fork's PR, which a comment from this trigger cannot.
      #
      # BEFORE `pnpm test`, deliberately: the budget is enforced there, and the table is
      # most wanted on the run where it fails.
      - name: First-load size budget
        working-directory: apps/web
        run: node ../../tools/report-size-budget.mjs dist
      # Asserts what a production build contains: no harness route, no `burrowHarness`
      # identifier in any shipped file, the CSP in every page, and -- as a control -- that
      # the harness IS present when BURROW_HARNESS=1, so the gating is doing the work.
      - name: Build-output tests
        working-directory: apps/web
        run: pnpm test

      # ---- the browsers -----------------------------------------------------------
      # ALL THREE, matching playwright.config.ts's projects.
      #
      # This installed `chromium` alone while the config already listed three projects, so
      # `playwright test` would have failed launching Firefox and WebKit. Caught by reading
      # the two against each other rather than by a run, because the job was failing earlier
      # for an unrelated reason and never reached this step.
      #
      # `--with-deps` needs root, which the runner has and a developer machine generally does
      # not -- WebKit in particular needs libgstreamer-plugins-bad and libavif, so it cannot
      # be launched locally without installing them. CI is where WebKit actually runs.
      - name: Install browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Engine end-to-end tests
        working-directory: apps/web
        run: pnpm exec playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # A single required status check, so branch protection does not need updating every
  # time a job is added.
  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, clippy, test, fuzz, wasm, mobile, deny, audit, web]
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed." >&2
          exit 1
      - run: echo "All CI jobs passed."
