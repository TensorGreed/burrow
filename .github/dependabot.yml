# Dependency updates. Weekly rather than daily: burrow has few dependencies, and a
# quiet, batched review is more likely to be read carefully than a stream of noise.
#
# Every update still goes through CI, which means `cargo deny check` — so an update that
# introduces a non-permissive transitive license, or an HTTP client, fails rather than
# merges. Dependabot cannot know our licensing policy; deny.toml is what enforces it.
version: 2

updates:
  # Actions are pinned by commit SHA in the workflows. Dependabot understands SHA pins
  # and will bump the SHA while keeping the `# vN` comment accurate, which is why
  # pinning does not mean going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci

  # The main Rust workspace.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
      - rust
    groups:
      # One PR for routine patch and minor bumps; majors come separately, since those
      # are the ones that need a human decision.
      rust-minor-and-patch:
        update-types:
          - minor
          - patch

  # `fuzz/` is a separate workspace with its own lockfile (cargo-fuzz requires that), so
  # it needs its own entry or it would never be updated.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
      - rust
      - fuzzing

  # This entry constrains the pnpm version in apps/web/package.json, which is pinned to
  # 11.x rather than the latest 12.x on purpose.
  #
  # Dependabot's updater image ships pnpm 11 and resolves the version via
  # `corepack install <version> --cache-only`. That sandbox cannot fetch, so a
  # `packageManager` of pnpm@12.x makes every npm update fail with `unknown_error` —
  # including security updates, and silently, since the failure is in Dependabot's own
  # run rather than in CI. Do not bump `packageManager` to 12 until Dependabot supports
  # it. The lockfile format (v9) is shared between pnpm 11 and 12, so this costs nothing
  # else.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
      - web
    groups:
      web-minor-and-patch:
        update-types:
          - minor
          - patch
