# Pinned so every machine and CI runner builds with the same compiler.
# Bumping this is a deliberate change: run the full test suite and cargo-deny after.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = [
    "wasm32-unknown-unknown",
    # Checked in CI so a core change cannot silently break a mobile target long
    # before M3/M4 build the apps. `cargo check` needs no SDK or NDK, only std.
    "aarch64-apple-ios",
    "aarch64-linux-android",
]
profile = "minimal"
