<!doctype html>
<meta charset="utf-8" />
<title>burrow spike — option 1</title>
<h1>option 1: Emscripten engine modules bridged through JS</h1>
<pre id="log">ready</pre>
<script>
  // Worker lifecycle lives here, including respawn after a wasm abort. Kept in the
  // page rather than the test so it mirrors what apps/web would actually ship.
  let worker = null;
  let seq = 0;
  const pending = new Map();
  let deaths = 0;

  function spawn() {
    worker = new Worker("worker.js");
    worker.onmessage = (e) => {
      const p = pending.get(e.data.id);
      if (p) {
        pending.delete(e.data.id);
        p.resolve(e.data);
      }
    };
    // A wasm abort surfaces here. Fail every in-flight request and discard the worker:
    // an aborted instance cannot be reused for anything.
    worker.onerror = (ev) => {
      ev.preventDefault();
      deaths++;
      for (const [, p] of pending) p.resolve({ ok: false, workerDied: true });
      pending.clear();
      worker.terminate();
      worker = null;
    };
  }

  function call(msg, timeoutMs = 120000) {
    if (!worker) spawn();
    const id = ++seq;
    return new Promise((resolve) => {
      pending.set(id, { resolve });
      worker.postMessage({ id, ...msg });
      setTimeout(() => {
        if (pending.has(id)) {
          pending.delete(id);
          // No reply and no error event: treat as a dead worker too.
          deaths++;
          if (worker) { worker.terminate(); worker = null; }
          resolve({ ok: false, workerDied: true, timedOut: true });
        }
      }, timeoutMs);
    });
  }

  // Exposed for Playwright.
  window.spike = {
    call,
    deaths: () => deaths,
    // A trap does not kill the worker, so recovery is the page's decision. After any
    // Internal error the instance is suspect and must be thrown away deliberately.
    discardWorker() {
      deaths++;
      if (worker) { worker.terminate(); worker = null; }
    },
    respawned: () => worker !== null,
    async coldLoad(name = "small-1page.pdf") {
      if (worker) { worker.terminate(); worker = null; }
      const t0 = performance.now();
      const r = await call({ cmd: "open", engine: "pdfium", name });
      return { ...r, coldMs: +(performance.now() - t0).toFixed(1) };
    },
  };
</script>
