# qpdf C functions burrow declares NATIVELY but deliberately does not export to wasm.
#
# =================================================================================
# WHY THIS FILE EXISTS
# =================================================================================
#
# `engines/build-wasm.sh` asserts that the functions declared in
# `core/burrow-engines/src/qpdf/ffi.rs` and the functions exported from `qpdf.wasm` are the
# same set. That invariant is the reason the web module cannot call anything ADR 0013 has not
# cleared: the export list is derived from ffi.rs rather than written by hand, so adding an
# export means adding a native declaration, where the trapped-function check applies.
#
# The invariant is right in one direction and too strong in the other. An export that is not
# declared natively is always wrong -- nothing cleared it. A declaration that is not exported
# is usually a mistake and is sometimes deliberate: the native and web paths do not implement
# the same operations at the same time. `burrow-ops` has `split` and `rotate`; `bindings/burrow-wasm`
# has neither, because there is no `impl PageExtractor for WebQpdf` and no `impl PageRotator
# for WebQpdf`. Exporting their C API today would make seven more functions callable from
# JavaScript for operations that do not exist on that path -- widening the worker's reachable
# surface with no caller, which is the opposite of what the export allowlist is for.
#
# So a declaration may be absent from the export list ONLY with an entry here, saying which
# operation it belongs to and why the web cannot use it yet. An entry is a temporary state
# with an owner, not an exemption: it is removed by the pull request that gives the web the
# matching implementation, in the same change that adds the export.
#
# Two directions of staleness fail, as in `qpdf-untrapped-accepted.toml`:
#
#   * an entry for a function nobody declares natively -- dead weight that reads as coverage;
#   * an entry for a function that IS exported -- a warning about a hazard that is not there,
#     which teaches people to stop reading the file.
#
# =================================================================================
# HOW THIS CAME TO BE NEEDED, WHICH IS THE PART WORTH REMEMBERING
# =================================================================================
#
# `qpdf_remove_page` was declared for `split` in PR #55 and never exported. The check above
# would have caught it on the commit that introduced it -- except that it lived inside
# `build-wasm.sh`, which CI runs only on a wasm cache MISS, and the cache key is
# `hashFiles('engines/pins.toml', 'engines/fetch.sh', 'engines/build-wasm.sh')`. Every PR
# since touched none of those, so the check did not run, and the drift sat on `main`.
#
# It surfaced only because rotate's branch edited a COMMENT in `pins.toml`, which changed the
# hash, which busted the cache, which rebuilt the engines, which ran the check -- and it then
# reported split's drift and rotate's together.
#
# That is the second cache-gated check in this repository to have hidden a real defect; the
# first was the qpdf crypto assertion, and `CLAUDE.md`'s rule about where a check lives in
# `ci.yml` was written from it. The comparison now lives in `tools/check-wasm-exports.sh`
# and runs in the `web` job on every run, warm cache or cold, because it reads only committed
# files and the cached `qpdf.wasm` -- both present either way.

# =================================================================================
# THE LIST IS NOT EMPTY: SPLIT'S PRUNING IS DECLARED NATIVELY AND NOT YET ON THE WEB
# =================================================================================
#
# The ten entries at the end of this file are the object-surgery functions `split`'s pruning
# needs (ADR 0019 §2b, issue #54). They are declared natively in the PR that closes the leak on
# the native path, and they are exported by the PR that gives `WebQpdf` an `impl PageExtractor`
# -- which is the lifecycle described above, running forwards for the first time since the four
# entries below ran it backwards.
#
# They are listed one per function rather than as a group, because the check compares sets and
# a group entry cannot be removed one function at a time.
#
# Four earlier entries went in the pull request that made each reachable from the web, which is
# the same lifecycle working correctly:
#
#   qpdf_remove_page      declared for split (#55), exported for reorder's bridge
#   qpdf_add_page_at      declared and exported for reorder's bridge
#   qpdf_oh_get_object_id  ditto -- object identity, which a handle is not (ADR 0013)
#   qpdf_oh_get_generation ditto
#
# TWO THINGS THAT WOULD OTHERWISE BE LOST WITH THEM:
#
#   * `qpdf_remove_page` being exported does NOT lift split's hold. Split is held because
#     ADR 0019 §2's rule is measured as unmet (issue #54): its outputs can still carry objects
#     belonging to pages they excluded. What keeps split off the web is that there is no
#     `impl PageExtractor for WebQpdf` and no wasm entry point -- and
#     `apps/web/src/production-build.test.ts` asserts the shipped bundle cannot name the
#     operation. The export is reachable only from Rust, which does not offer it.
#
#   * An empty list means the "argued absence" rules below have no live instance -- the
#     `absent` set is empty, so the entry-count agreement and the reason check examine nothing
#     in a real run. That is exactly the shape `CLAUDE.md` warns about, and it is why
#     `tools/test-check-wasm-exports.sh` gives each rule its own fixture: the rules are kept
#     alive by cases that plant a defect, not by the repository happening to contain one.
#
#     That self-test itself got caught by this. Its rule-4 fixture built an entry with no
#     reason by DELETING one from this file, so emptying the file made the fixture throw, the
#     case run against a nonexistent path, and the wrong message satisfy it. It builds both
#     halves itself now.

[meta]
version = 1
# The ADR that governs which qpdf functions may be called at all.
trapping_adr = "docs/adr/0013-qpdf-c-api-and-prescan.md"

# =================================================================================
# split's pruning (ADR 0019 §2b, issue #54). Removed by the PR that gives the web an
# `impl PageExtractor for WebQpdf`, in the same change that adds each export.
# =================================================================================
#
# ONE SHARED REASON, STATED ONCE HERE AND REFERRED TO BY EACH ENTRY. Every function below is
# object surgery on a destination document: reading a dictionary's keys, filtering an array,
# removing a key, pulling a decoded content stream out so its resource names can be read.
# `burrow-ops`'s `split` calls them through `PageExtractor::extract`, and there is no
# `impl PageExtractor for WebQpdf` -- so on the web they would be ten more functions reachable
# from JavaScript with no caller at all. That is the opposite of what an export allowlist is
# for, and it is the argument the file's preamble asks each entry to make.
#
# Exporting them is NOT free even beyond the reachable surface: it busts the wasm cache key,
# forces an engine rebuild, regenerates the CSP hashes and moves the size budget, whose total
# headroom is under a third of its 3% gate. Doing that in the PR that cannot use the result
# would spend the budget twice.

[[function]]
name = "qpdf_oh_unparse_resolved"
reason = """\
split's pruning: reads a dictionary's own keys as syntax, because qpdf's key iterator is not trapped and so may not be called (ADR 0013 §1). It is what makes the page-key rule an allowlist rather than a list of keys somebody thought of. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_remove_key"
reason = """\
split's pruning: removes a key the allowlist does not name -- the rule that closes `/B`, `/AA`, `/Thumb`, `/PieceInfo` and everything nobody enumerated in one stroke. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_get_array_n_items"
reason = """\
split's pruning: the length of a shared `/Annots` array being filtered. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_get_array_item"
reason = """\
split's pruning: one annotation out of that array, so its `/P` can be compared against the page. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_erase_item"
reason = """\
split's pruning: drops an annotation belonging to a page this output does not contain. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_get_name"
reason = """\
split's pruning: reads a resource sub-dictionary's entry name, to compare it against the names the copied content streams actually use. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_get_dict"
reason = """\
split's pruning: a stream's dictionary. A Form XObject is `ot_stream`, not `ot_dictionary`, so its own `/Resources` is unreachable without this. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_get_page_content_data"
reason = """\
split's pruning: the page's DECODED content, which is where the resource names are. In the file they are inside a flate stream, and a scan of the raw bytes would find none of them and prune every resource the page uses. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_get_stream_data"
reason = """\
split's pruning: the same for a nested Form XObject, tiling pattern, Type 3 glyph procedure or appearance stream, so the name walk can follow them. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""

[[function]]
name = "qpdf_oh_free_buffer"
reason = """\
split's pruning: frees the two `malloc`ed buffers above, which are the caller's rather than qpdf's. Not calling it leaks the decompressed size of every stream on every page of every output. \
Not exported because there is no `impl PageExtractor for WebQpdf` -- see the shared reason \
above. Removed by the bridge PR, in the same change that adds the export."""
