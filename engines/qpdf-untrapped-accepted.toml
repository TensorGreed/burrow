# qpdf C functions burrow calls that do NOT route through `trap_errors`, and why each is
# accepted.
#
# READ THIS BEFORE ADDING AN ENTRY.
#
# `qpdf-c.h:113-115` reads like a blanket promise that C++ exceptions never escape the C
# API. It is not true per-function: the catching is done by one helper, `trap_errors`, and
# only functions routed through it are covered. `qpdf_is_linearized` is not, and an ordinary
# 356-byte PDF containing `9999999999 0 obj` kills the process through it --
#
#     fatal runtime error: Rust cannot catch foreign exceptions, aborting
#
# -- measured during M1 PR 3's review. `catch_unwind` does not help; a foreign exception is
# not a Rust panic. On the web that is the worker, on mobile the app. ADR 0013 §1.
#
# So an entry here is an ARGUMENT, not a waiver. It has to say why this particular function
# cannot throw, and "it looked fine" is not that. The bar every entry below meets:
#
#   The function is NON-PARSING. It assigns a field, flips a flag, or reads a stored value.
#   It never touches the PDF's bytes, never resolves an object, never converts a
#   file-derived number. Its only failure mode is allocation -- and since Rust 1.81,
#   unwinding out of an `extern "C"` frame is a DEFINED abort rather than undefined
#   behaviour, so an allocation failure here is a clean process death, not memory unsafety.
#
# ON ALLOCATION FAILURE, SPECIFICALLY: C++ `new` THROWS `std::bad_alloc`. It does not return
# null. So the honest description of OOM in an untrapped function here is a foreign exception
# out of an `extern "C"` frame -- the accepted defined-abort case above -- and NOT a graceful
# null the caller inspects. Two entries below said otherwise and were corrected in M1 PR 4c's
# security review. The crate's null checks are defensive belt-and-braces; they are not the
# expected path, and no entry may claim they are.
#
# A function that reads the document is not eligible, however harmless it looks.
# `qpdf_is_linearized` is one line long.
#
# tools/check-qpdf-trapped.py enforces that every declared function is either on the
# generated trapped list or here, that every entry here is actually declared, and that no
# entry here is one upstream DOES trap -- because an exemption for a function that is
# genuinely safe reads as a hazard that is not there.

[meta]
adr = "docs/adr/0013-qpdf-c-api-and-prescan.md"
qpdf_version = "12.4.1"
# The version these arguments were checked against. A bump re-checks them: `trap_errors`
# routing can change without a signature changing. See "Bumping an engine pin" in
# engines/pins.toml.

# ---------------------------------------------------------------------------------
# Lifecycle. Allocation only.
# ---------------------------------------------------------------------------------

[[function]]
name = "qpdf_init"
reason = """\
Allocates the `qpdf_data` struct and returns it; no PDF exists yet, so there is nothing to \
parse and nothing to throw about. It is a `new` expression, so on allocation failure it \
throws `std::bad_alloc` rather than returning null -- accepted as a defined abort per the \
preamble. The crate's null check is defensive, not the expected path."""

[[function]]
name = "qpdf_cleanup"
reason = """\
Frees the struct. `qpdf-c.cc`'s implementation checks whether an error was left unretrieved \
and, if so, writes to the DEFAULT logger -- which is not gated on `qpdf_silence_errors` and \
whose text carries byte offsets. `Document::drop` drains the error slot before calling this, \
so that branch is unreachable; ADR 0013 §2 records it because it is a property of our \
control flow rather than of the type."""

# ---------------------------------------------------------------------------------
# Setters. Each assigns one field on `qpdf_data`.
# ---------------------------------------------------------------------------------

[[function]]
name = "qpdf_silence_errors"
reason = """\
Sets a bool on `qpdf_data`. Load-bearing rather than optional: without it, functions that do \
not return an error code print to the host process's stderr, which in a browser is the \
devtools console. `tests/secret_leak.rs` fails when it is removed."""

[[function]]
name = "qpdf_set_suppress_warnings"
reason = """\
Sets a bool on `qpdf_data`. No document is consulted; qpdf's warning path reads the flag \
later, inside functions that are themselves trapped."""

[[function]]
name = "qpdf_set_logger"
reason = """\
Stores a `qpdf_logger` handle on `qpdf_data`. Takes no callback into Rust, so no Rust code \
ever runs on a C++ stack -- which is why ADR 0013 §2 could use qpdf's own \
`qpdf_log_dest_discard` rather than writing a C++ shim."""

[[function]]
name = "qpdf_set_attempt_recovery"
reason = """\
Sets a bool consulted during a later read. The read itself is `qpdf_read_memory`, which is \
trapped, so the recovery work that flag enables happens inside the trapped call."""

[[function]]
name = "qpdf_global_set_uint32"
reason = """\
Writes one process-global `uint32_t` limit and returns a status code. Takes no `qpdf_data` \
and touches no document. ADR 0013 §5: every decompression memory limit qpdf offers defaults \
to unlimited, so these are set once behind a `OnceLock` before any `qpdf_data` exists."""

# ---------------------------------------------------------------------------------
# Error accessors. These read a stored error; they do not produce one.
# ---------------------------------------------------------------------------------

[[function]]
name = "qpdf_has_error"
reason = """\
Reads a bool that a trapped call already set. Cannot itself fail: whatever threw did so \
inside the trapped function, which stored the result rather than propagating it."""

[[function]]
name = "qpdf_get_error"
reason = """\
Moves the stored `QPDFExc` out of the slot and returns a handle, consuming it. No parsing; \
the exception was caught and stored by `trap_errors` before this is reachable. Draining the \
slot is also what keeps `qpdf_cleanup`'s default-logger branch unreachable."""

[[function]]
name = "qpdf_get_error_code"
reason = """\
Reads the integer code off a stored error. `qpdf_error_code_e`'s numbering is guaranteed \
across major releases (`Constants.h`), which is why the crate matches on codes and does not \
declare the message accessors at all -- a function that cannot be called cannot leak."""

# ---------------------------------------------------------------------------------
# The logger C binding. A DIFFERENT acceptance, and weaker -- say so rather than reuse the
# paragraph above.
# ---------------------------------------------------------------------------------
#
# These four live in `libqpdf/qpdflogger-c.cc`, which contains NO try/catch at all -- not
# even the partial coverage `qpdf-c.cc` has. They are accepted on the non-parsing argument
# alone: each allocates or assigns and none is handed a document. That is a narrower basis
# than the functions above, which sit in a file where trapping at least exists, and it is
# recorded here rather than smoothed over. ADR 0013 §1 calls this the
# "accepted-abort-on-OOM category".

[[function]]
name = "qpdflogger_create"
reason = """\
Allocates a `QPDFLogger` handle. In qpdflogger-c.cc, which has no try/catch anywhere, so \
this rests on the non-parsing argument alone: it is handed no document. A `new` expression, \
so allocation failure throws `std::bad_alloc` rather than returning null -- accepted as a \
defined abort per the preamble. The crate's null check, which skips `qpdf_set_logger`, is \
defensive rather than the expected path."""

[[function]]
name = "qpdflogger_set_info"
reason = """\
Points the logger's info stream at a `qpdf_log_dest_e` -- here `qpdf_log_dest_discard`, \
which is qpdf's own `Pl_Discard`. Assigns a pipeline; parses nothing. Same weaker basis as \
`qpdflogger_create`: qpdflogger-c.cc has no try/catch."""

[[function]]
name = "qpdflogger_set_warn"
reason = """\
As `qpdflogger_set_info`, for the warning stream. This is the one that matters most for \
privacy: qpdf's warnings quote object numbers and byte offsets for files that parse \
SUCCESSFULLY, not only for failures."""

[[function]]
name = "qpdflogger_set_error"
reason = """\
As `qpdflogger_set_info`, for the error stream. Assigns a destination constant; parses \
nothing. Same weaker basis: qpdflogger-c.cc has no try/catch."""

# ---------------------------------------------------------------------------------
# Link proof. Declared in a `#[cfg(test)]`-gated block far from the qpdf module.
# ---------------------------------------------------------------------------------

[[function]]
name = "qpdf_get_qpdf_version"
reason = """\
Returns `QPDF::QPDFVersion().c_str()` -- a `static std::string const&` (`QPDF.hh:55`), so \
there is no temporary to dangle and no allocation to fail. No `qpdf_data`, no document, \
nothing to parse. Declared in `core/burrow-engines/src/link_check.rs`'s `extern "C"` block \
to prove libqpdf is actually linked, and gated on `#[cfg(test)]`, so it never ships. It was \
invisible to this check until M1 PR 4c's security review found the fourth declaration \
site."""

# ---------------------------------------------------------------------------------
# The write path, added in M1 PR B for `merge` (ADR 0017).
#
# ONE SHARED PRECONDITION, AND IT IS NOT A FORMALITY. All three dereference
# `qpdf->qpdf_writer`, which `qpdf_init_write_memory` creates. That function sets
# `qpdf->write_memory = true` UNCONDITIONALLY, after a `trap_errors` call that may have
# failed -- so a caller that ignores its status and calls these anyway can reach a null
# `shared_ptr` deref. `qpdf/write.rs` therefore calls none of them unless
# `qpdf_init_write_memory` returned success AND the subsequent `qpdf_write` did too, and a
# unit test pins that ordering. The hazard is upstream's; the discipline is ours.
# ---------------------------------------------------------------------------------

[[function]]
name = "qpdf_get_buffer_length"
reason = """\
Returns `qpdf->output_buffer->getSize()`, which is `return m->size` -- a field read on a \
Buffer qpdf has already produced (Buffer.cc:72-75). It reaches that through \
`qpdf_get_buffer_internal`, whose only work is `qpdf_writer->getBufferSharedPointer()`: a \
pointer swap (QPDFWriter.cc:542-554) wrapped in a `shared_ptr`. NON-PARSING in the sense \
the preamble requires -- it never touches the PDF's bytes, never resolves an object, never \
converts a file-derived number. The document has already been written by the time it is \
called. Its only failure mode is allocating the shared_ptr control block, which throws \
`std::bad_alloc` rather than returning null, accepted as a defined abort per the preamble. \
See the shared precondition above for the null-writer hazard."""

[[function]]
name = "qpdf_get_buffer"
reason = """\
As `qpdf_get_buffer_length`, returning `m->buf` instead of `m->size` (Buffer.cc:77-81). \
Same internal call, same non-parsing argument, same allocation-only failure mode, same \
precondition. Note it returns a `const unsigned char*` owned by the `qpdf_data`, valid \
until the next `qpdf_init_write*` or `qpdf_cleanup`: `qpdf/write.rs` copies out of it \
immediately and never stores it."""

[[function]]
name = "qpdf_set_deterministic_ID"
reason = """\
`qpdf->qpdf_writer->setDeterministicID(value != QPDF_FALSE)` (qpdf-c.cc:578-583) -- \
assigns a bool on the writer. Parses nothing, reads nothing from the document. Called so \
merge output is a function of its inputs rather than of the clock and the random pool, \
which is what makes a golden test possible at all; without it every run produces a \
different `/ID` and the committed expectation could only ever be a page count. \
Must be called AFTER `qpdf_init_write_memory` -- qpdf-c.h says the write parameters are \
set between `qpdf_init_write*` and `qpdf_write`, and calling it first dereferences a writer \
that does not exist yet and takes the process down. Measured during ADR 0017's engine \
comparison, by core dump."""

[[function]]
name = "qpdf_set_object_stream_mode"
reason = """\
`qpdf->qpdf_writer->setObjectStreamMode(mode)` (qpdf-c.cc:523-527), which reaches \
`Config::object_streams` -- `object_streams_ = val; return *this;` \
(QPDFWriter_private.hh:110-114). A plain assignment of a caller-chosen enum onto the writer. \
It parses nothing, reads nothing from the document, and cannot see a byte of the input. \
It meets this file's bar and is on the stronger side of it: sibling setters such as \
`compress_streams` call `Config::usage`, which throws when `permissive_` is false, and \
`object_streams` has no such call. \
NOT "cannot throw at all", which an earlier version of this entry said and security review \
corrected. `qpdf-c.cc:525` calls `QTC::TC(...)` before the forward, and `QTC::TC_real` \
(QTC.cc:16-49) inserts into two function-local statics -- so `std::bad_alloc` is reachable, \
the defined-abort case this file already reasons about -- and, when BOTH `TC_SCOPE=qpdf` and \
`TC_FILENAME` are set in the environment, calls `QUtil::safe_fopen`, which throws \
`std::runtime_error` if the file cannot be opened. Neither path is reachable from file \
content, and the second is inert unless someone sets those variables; both are identical for \
every setter this file already accepts. Recorded because an entry that markets itself as \
stronger than the bar has to be exact about where it stops. \
Worth noting alongside: `permissive_` defaults true (QPDFWriter_private.hh:319), so even the \
`usage()`-calling siblings would not throw in burrow's configuration -- the contrast with \
`compress_streams` is real but narrower than "cannot throw". \
The `mode` is always one of the two constants in `qpdf/ffi.rs`, so the C enum cannot receive \
a value it has no case for. \
Must be called AFTER `qpdf_init_write_memory`, for the same reason \
`qpdf_set_deterministic_ID` records -- the writer does not exist until that call succeeds and \
this dereferences it. \
Set to `qpdf_o_generate` only by `compress`; every other operation passes `qpdf_o_preserve`, \
which is qpdf's own default, spelled out at the call site so the difference is visible. \
Spike 0005 measured why this is the only compression lever burrow declares: the other four \
the C API exposes are already the writer's defaults."""

[[function]]
name = "qpdf_oh_new_integer"
reason = """\
`new_object(qpdf, QPDFObjectHandle::newInteger(value))` (qpdf-c.cc:1487-1492) -- constructs \
an integer object from a `long long` this crate chose and puts it in the handle cache \
(`++next_oh`, one map insert). It never reads the document, never resolves an object and \
cannot see a byte of the input, so it meets this file's bar exactly: non-parsing, never \
touches the PDF's bytes. It can fail only by allocation, a defined abort since Rust 1.81. \
Note the asymmetry with `qpdf_oh_get_key`, which is NOT exemptible on any argument -- that \
one resolves an indirect object, which is the parser on file-controlled bytes. It is on the \
trapped list, reached through `do_with_oh` (ADR 0013's 2026-09-13 amendment). Used by \
`qpdf/rotate.rs` to build the `/Rotate` value it writes."""

[[function]]
name = "qpdf_oh_new_null"
reason = """\
`new_object(qpdf, QPDFObjectHandle::newNull())` (qpdf-c.cc:1474-1478) -- constructs the null \
object and puts it in the handle cache (`++next_oh`, one map insert). The whole body, plus the \
`QTC::TC` coverage macro. It never reads the document, never resolves an object and cannot see \
a byte of the input, so it meets this file's bar exactly: non-parsing, never touches the PDF's \
bytes. It is the same argument as `qpdf_oh_new_integer` above, one constructor over: that one \
takes a `long long` this crate chose, this one takes nothing at all. \
NOT "cannot throw at all", for the reason `qpdf_set_object_stream_mode` records after a \
previous security review corrected it there: the `QTC::TC(...)` before the forward reaches \
`QTC::TC_real` (QTC.cc:16-49), which inserts into two function-local statics -- so \
`std::bad_alloc` is reachable, the defined-abort case this file already reasons about -- and, \
when BOTH `TC_SCOPE=qpdf` and `TC_FILENAME` are set in the environment, calls \
`QUtil::safe_fopen`, which throws `std::runtime_error` if the file cannot be opened. Neither \
path is reachable from file content and the second is inert unless someone sets those \
variables. Recorded because this file's preamble demands an entry be exact about where it \
stops, and the first draft of this one -- like the `qpdf_oh_new_integer` entry it was modelled \
on -- stopped one clause early. \
WHY IT IS DECLARED RATHER THAN WORKED AROUND. `qpdf_oh_replace_stream_data` takes object \
handles for `/Filter` and `/DecodeParms`, and a null object is how the C API says "no filter". \
Spike 0006 obtained one by asking a dictionary for a key it does not have, which works; ADR \
0029 records it as a workaround rather than a design -- "getting a null by asking for a key \
that is not there is cleverness in the place this repository has least appetite for it". It is \
also WORSE on this file's own bar: `qpdf_oh_get_key` resolves an indirect object, which is the \
parser running on file-controlled bytes, and it is on the trapped list for exactly that reason. \
Reaching a constant through the parser to avoid declaring a constructor is the expensive way \
round. \
Used by redaction (#130, ADR 0029 SS1) and by nothing else."""

[[function]]
name = "qpdf_oh_release"
reason = """\
`qpdf->oh_cache.erase(oh)` (qpdf-c.cc:847-850) -- one erase on a `std::map`, and the whole \
body. Parses nothing, resolves nothing, reads nothing from the document; `std::map::erase` \
by key does not allocate and does not throw for a key type that is an integer. \
NOT calling it is the hazard rather than calling it: the cache only grows and `next_oh` \
never reuses an id, so a per-page page-tree walk that took a handle per ancestor and \
released none would leak one `QPDFObjectHandle` per node for as long as the document is \
open -- growth `max_memory_bytes` cannot see, because it samples RSS at operation \
boundaries and detects rather than bounds (ADR 0007). `qpdf/handle.rs` makes the release \
automatic and `rotate`'s tests assert the live count returns to baseline."""

[[function]]
name = "qpdf_oh_free_buffer"
reason = """\
`if (bufp && *bufp) { free(*bufp); *bufp = nullptr; }` (qpdf-c.cc:1769-1776) -- the whole \
body, plus the `QTC::TC` coverage macro. It takes no `qpdf_data` at all, so it cannot reach \
a document, an object cache or the parser; there is no argument to it through which a PDF \
could arrive. `free` is C and does not throw. It meets this file's bar more plainly than \
any other entry: the bar asks that a function never touch the PDF's bytes, and this one has \
no way to name a PDF. \
It is required rather than optional. `qpdf_oh_get_page_content_data` and \
`qpdf_oh_get_stream_data` return `malloc`ed buffers that are the CALLER's to free -- unlike \
every other pointer this crate receives from qpdf, which qpdf owns and recycles. \
`split`'s resource-name walk takes one buffer per content stream, so not freeing them would \
leak the decompressed size of every stream on every page of every output. \
Note that it is untrapped for a reason that is NOT this file's usual one: `QTC::TC` is a \
top-level statement, which is what keeps it (and `qpdf_get_root`, and every `qpdf_oh_is_*` \
predicate) off the generated list under ADR 0013's caller rule. That rule is about reachable \
code outside a trap; here there is no trap to be outside of and nothing that could throw \
into it."""
