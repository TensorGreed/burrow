# Licence manifest for native engines and everything they bundle.
#
# WHY THIS FILE EXISTS
# cargo-deny sees Rust crates and nothing else. It cannot see PDFium, qpdf, or the
# components they vendor -- and that is exactly where every finding in ADR 0008 came
# from. A manual audit found them; this file makes the result repeatable and
# machine-checked.
#
# RULES
# - Every licence here must be on ADR 0008's allowlist. tools/check-engine-licences.py
#   fails CI otherwise.
# - `linked` means "confirmed present in a shipped artifact", by symbol inspection, not
#   by assumption. `linked = false` with a licence still listed means the component ships
#   in the package but was not found in the binary.
# - `artifacts` lists every shipped artifact the component is DISTRIBUTED with, by the
#   ids declared in [[artifact]] below. `linked_in` is the subset where its code was
#   actually found. The two differ, and the difference is the point of the field.
# - THE LICENCE SET IS PER-ARTIFACT. pdfium-binaries' steps/08-licenses.sh derives each
#   platform's licences/ directory from that platform's build.ninja, so the Linux builds
#   genuinely bundle components the WASM build does not. Never copy one artifact's
#   finding onto another.
# - Adding a component whose licence is not on the allowlist requires a new ADR. Do not
#   add the licence here first.
#
# LIMITS OF THIS FILE
# It is hand-maintained. The CI check verifies that every DECLARED licence is allowed; it
# cannot detect a component nobody declared. That still needs a periodic audit. Treat
# this as a floor, not a guarantee.
#
# TWO PATHS PER COMPONENT, AND THEY DO DIFFERENT JOBS
# - `license_file` is the AUDITED ORIGINAL. Paths under `vendor/` point into
#   engines/vendor/, which is GITIGNORED (reproducible from engines/pins.toml via
#   engines/fetch.sh). It records where the audit read the text, not where it ships.
# - `license_text` is a COMMITTED COPY, under engines/licences/. Mandatory for every
#   `linked = true` component. It exists because the website credits page is generated
#   from this manifest at build time and must build from a clean checkout -- and because
#   CI's web job stages only the WASM vendor prefix, while most `license_file` paths name
#   vendor/native-aarch64/. See engines/licences/README.md.
#
# tools/check-engine-licences.py requires the copy to exist AND, when the vendor tree is
# present, to be byte-identical to the original. Editing one without the other fails CI,
# which is the drift a committed copy would otherwise introduce.
#
# Two components point `license_text` at docs/adr/licences/ instead: agg23 and harfbuzz,
# whose texts are committed there because they exist NOWHERE ELSE -- AGG has no SPDX
# identifier and PDFium's package ships no HarfBuzz licence file at all.
#
# This manifest is also the input for M1's SBOM (see .github/workflows/release.yml).

[meta]
version = 2
# ADR that governs the allowlist this file is checked against.
policy_adr = "docs/adr/0008-widened-licence-allowlist.md"
# Acquisition ADR and the pin file the audited artifacts came from.
acquisition_adr = "docs/adr/0004-native-engines.md"
pins = "engines/pins.toml"
# Audit that produced the current contents.
last_audited = "2026-09-10"
last_audited_by = "M1 PR 1 production acquisition audit (branch feat/engine-acquisition)"
# Every component below is declared with a licence on ADR 0008's allowlist, so
# tools/check-engine-licences.py passes. This manifest spent M1 PR 1 deliberately failing
# -- see RESOLVED FINDINGS further down for what was blocked and what unblocked it.
#
# If you are here because the check now fails: do NOT "fix" it by editing the checker or by
# adding a licence to ADR 0008's allowlist. Adding a licence needs an ADR.
status = "passing"
resolved_by = "docs/adr/0010-harfbuzz-and-icu-in-pdfium.md"

# ---------------------------------------------------------------------------------
# Shipped artifacts, by id. `artifacts` / `linked_in` on each component refer to these.
# ---------------------------------------------------------------------------------

[[artifact]]
id = "pdfium-wasm"
files = "vendor/wasm/lib/pdfium.js + vendor/wasm/lib/pdfium.wasm"
source = "prebuilt, pdfium-binaries chromium/8044, pdfium-wasm.tgz"
licences_dir = "vendor/wasm/licenses-pdfium/"
note = "Finished Emscripten module; no static archive is published. args.gn: pdf_enable_v8=false, pdf_enable_xfa=false, use_custom_libcxx=false (so it uses Emscripten's libc++, not Chromium's)."

[[artifact]]
id = "pdfium-linux-arm64"
files = "vendor/native-aarch64/lib/libpdfium.so"
source = "prebuilt, pdfium-binaries chromium/8044, pdfium-linux-arm64.tgz"
licences_dir = "vendor/native-aarch64/licenses-pdfium/"
note = "args.gn has no use_custom_libcxx, so LLVM libc++ IS statically bundled -- which is why llvm-libc.txt appears in this artifact's licence set and not in the wasm one."

[[artifact]]
id = "pdfium-linux-x64"
files = "lib/libpdfium.so inside vendor/pdfium-linux-x64.tgz"
source = "prebuilt, pdfium-binaries chromium/8044, pdfium-linux-x64.tgz"
licences_dir = "vendor/src/pdfium-x86_64-probe/licenses/"
note = """CORRECTED 2026-09-12. The previous note said this artifact was "NOT yet staged \
into a vendor prefix" and its libpdfium.so "NOT symbol-inspected". Both were true of the M1 \
PR 1 audit machine and neither is true of CI, and the difference matters: \
engines/build-native.sh builds for the HOST arch, and CI runs on x86-64. So CI stages \
vendor/native-x86_64/ on every run and tools/detect-engine-components.py symbol-inspects \
this artifact there -- 2472 harfbuzz hits, 256 agg23, and the rest \
(run 34707958020). It is the AARCH64 build that no hosted runner covers, which is the \
opposite of what the old note implied and is tracked in issue #30. \
\
What IS still inherited is this artifact's `linked_in`: it was written from the aarch64 \
audit and has never been re-derived per artifact. detect-engine-components.py checks that \
every component it RECOGNISES is declared; it does not populate or verify `linked_in`, and \
it knows nine fingerprints (issue #15). Its licences/ directory is byte-identical to \
pdfium-linux-arm64's (all 14 files verified by sha256), which is good evidence the DECLARED \
component sets match and is not evidence the LINKED ones do -- that directory is derived \
from the build config, not from the binary. \
\
The stale note had a cost beyond being wrong: it was read as a statement about CI, which is \
how check-engine-licences.py came to compare licence texts against vendor/native-aarch64/ \
paths that do not exist on a CI runner. Eleven of fifteen comparisons were silently skipped \
until resolve_audited_original() started treating the arch as a wildcard."""

