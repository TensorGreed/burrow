# --- WAS BLOCKING #1, resolved by ADR 0010 ----------------------------------------

[[component]]
name = "harfbuzz (bundled in pdfium)"
version = "14.3.1"
license = "MIT-Modern-Variant"
license_file = "docs/adr/licences/harfbuzz-14.3.1-COPYING.txt"
license_text = "docs/adr/licences/harfbuzz-14.3.1-COPYING.txt"
artifacts = ["pdfium-wasm", "pdfium-linux-arm64", "pdfium-linux-x64"]
linked_in = ["pdfium-wasm", "pdfium-linux-arm64", "pdfium-linux-x64"]
linked = true
notice_required = "Reproduce the copyright notice and both disclaimer paragraphs in all copies. MIT-Modern-Variant."
notes = """DETERMINED by ADR 0010; was previously LicenseRef-UNDETERMINED.

Version and licence text are pinned to a commit, not guessed. PDFium's DEPS on branch \
chromium/8044 pins harfbuzz_revision to 886fc1e645388080b72f6d9b06347533a0018045, and \
meson.build at that commit reads version: '14.3.1'.

SPDX id VERIFIED, not assumed: the COPYING file calls itself "Old MIT", and its text from \
the grant clause onward is byte-for-byte identical to SPDX's canonical MIT-Modern-Variant \
licenseText after normalisation. OSI-approved.

THE ARTIFACT SHIPS NO HARFBUZZ LICENCE FILE. Upstream's steps/08-licenses.sh derives its \
set from build.ninja and has no case for harfbuzz, so the notice the licence requires does \
not travel with the binary. We commit it ourselves at the license_file path above, with \
provenance and a re-fetch command in docs/adr/licences/PROVENANCE.md.

Evidence: 557 demangled hb_* symbols in libpdfium.so (arm64), including \
hb_icu_get_unicode_funcs -- which is also how ICU gets linked. In pdfium.wasm, names are \
stripped, so the evidence is the HB_FONT_FUNCS string plus the inference from ICU's \
presence (hb-icu is HarfBuzz's own ICU integration).

M2 HAZARD: ADR 0004 selects hb-subset as our font-subsetting engine. Statically linking a \
second HarfBuzz alongside PDFium's copy means two definitions of every hb_* symbol in one \
binary, resolved first-wins by link order, with two allocator states. Must be resolved \
before hb-subset is linked. See ADR 0010."""

[[component]]
name = "icu"
version = "78.2"
license = "Unicode-3.0 AND ICU"
license_file = "vendor/native-aarch64/licenses-pdfium/icu.txt"
license_text = "engines/licences/icu.txt"
artifacts = ["pdfium-wasm", "pdfium-linux-arm64", "pdfium-linux-x64"]
linked_in = ["pdfium-wasm", "pdfium-linux-arm64", "pdfium-linux-x64"]
linked = true
notes = """Version pinned, not inferred: PDFium's DEPS on chromium/8044 pins icu_revision \
to 8cc91d9b6ab9991802fd208ee03a69714fd0251c, whose source/common/unicode/uvernum.h reads \
U_ICU_VERSION "78.2" -- matching the _78 symbol suffix observed in the binary.

ADR 0008 recorded linked = false, reasoning from pdf_enable_xfa = false. THAT REASONING \
WAS WRONG: ICU arrives via HarfBuzz's hb-icu integration, not via XFA. Corrected by \
ADR 0010.

Evidence: 489 version-suffixed symbols in libpdfium.so (ubidi_setPara_78, u_charType_78, \
ucase_toFullFolding_78, udata_openChoice_78). In pdfium.wasm, 18 RTTI type-name strings \
(N6icu_7810UnicodeSetE, N6icu_7813UnicodeStringE) plus 4 icudt78/ICUDATA markers -- RTTI \
names exist only if the classes were compiled in. Linked in ALL THREE artifacts.

The licence expression is narrowed to what is actually shipped. ADR 0010 audited every \
third-party section of icu.txt against both artifacts:

  Unicode-3.0 (headline)          LINKED    489 native / 18 wasm
  ICU (ICU 1.8.1 to 57.1)         legacy    admitted by ADR 0010 rather than argued away
  cjdict.txt  BSD-3-Clause        not linked   0 ubrk_/BreakIterator
  laodict.txt                     not linked   0
  burmesedict.txt                 not linked   0
  Time Zone Database  public dom  not linked   0 ucal_/zoneinfo64
  Google double-conversion  BSD-3 not linked   0
  nlohmann/json  MIT              not linked   0
  aclocal.m4  GPL-2.0+Autoconf    not linked   build script, not compiled
  config.guess/sub  GPL-3.0+exc   not linked   build script, not compiled
  install-sh  MIT-old-style       not linked   build script
  sorttable.js  X11               not linked   ICU4J only; we use ICU4C

The GPL sections cover four ICU4C autotools files, each carrying the Autoconf exception, \
none compiled -- checked for the third time. BSD-3-Clause and MIT were dropped from the \
expression because the components carrying them are not linked."""

