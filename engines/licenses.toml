[[component]]
name = "Emscripten runtime (musl libc, libc++, compiler-rt, JS glue)"
version = "6.0.9"
license = "MIT AND Apache-2.0 WITH LLVM-exception"
license_file = "emsdk:upstream/emscripten/LICENSE"
license_text = "engines/licences/emscripten.txt"
artifacts = ["pdfium-wasm", "qpdf-wasm", "zlib-wasm", "jpeg-wasm"]
linked_in = ["pdfium-wasm", "qpdf-wasm", "jpeg-wasm"]
linked = true
notes = """RETAINED, unlike the zlib and libjpeg port entries: Emscripten still contributes \
musl-derived libc, libc++/libc++abi and compiler-rt to every wasm artifact, plus the 164 KB \
pdfium.js and the qpdf-probe.js glue. Pinned to 6.0.9 in engines/pins.toml, and \
engines/build-wasm.sh refuses to run against any other version because this is shipped code, \
not a tool.

Emscripten's own LICENSE offers MIT OR University of Illinois/NCSA; we take MIT. musl is MIT
(system/lib/libc/musl/COPYRIGHT), and some JS glue derives from Node's MIT licence. libc++,
libc++abi and compiler-rt come from LLVM under Apache-2.0 WITH LLVM-exception. Emscripten's
LICENSE notes third_party/ carries other licences; none of it is copyleft, and none is reached
by our -sMODULARIZE builds.

NOT listed in the licences/ directory that the pdfium wasm package ships, so that package's
notices are incomplete on their own -- and the wasm package additionally omits llvm-libc.txt
that both Linux packages carry, for the same reason (its libc++ is Emscripten's, not
Chromium's)."""
