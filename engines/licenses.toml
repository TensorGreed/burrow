# =================================================================================
# RESOLVED FINDINGS -- both closed by ADR 0010. Kept because the reasoning is the
# reason the components below carry the licences they do.
#
# M1 PR 1's audit found two components in the PDFium artifacts that ADR 0008 did not
# account for. Both were recorded with licence identifiers that were NOT on the
# allowlist, so tools/check-engine-licences.py failed on purpose: the honest state of
# the audit was "blocked", and a passing check would have hidden it.
#
# ADR 0010 resolved both -- HarfBuzz as MIT-Modern-Variant with the licence text
# committed under docs/adr/licences/, ICU as ICU (Unicode-3.0-compatible) -- and
# widened the allowlist to admit them. The findings as they stood are below.
#
#   1. harfbuzz -- CONFIRMED LINKED into libpdfium.so (1192 hb_* symbols) and almost
#      certainly into pdfium.wasm, yet NO harfbuzz licence file ships in ANY of the
#      three artifacts' licences/ directories. We cannot cite the grant we are relying
#      on, and MIT-style terms require reproducing a notice we do not have.
#
#   2. icu -- CONFIRMED LINKED (123 ICU 78 symbols: ubidi_*, ucase_*, ucptrie_*,
#      u_char*; plus icu_78 RTTI strings in pdfium.wasm). ADR 0008 recorded ICU as
#      `linked = false` and stated: "If ICU is ever linked, its other sub-licences (the
#      old ICU licence, MIT-old-style, BSD-3-Clause, public-domain tz data) must be
#      enumerated here first." They are now enumerated, and one of them -- the ICU
#      licence for ICU 1.8.1 to ICU 57.1 -- is not on the allowlist.
#
# Resolving either required a new ADR, not an edit here or to the checker. That ADR is
# docs/adr/0010-harfbuzz-and-icu-in-pdfium.md, and it also added
# tools/detect-engine-components.py -- which asks the question this manifest cannot,
# namely whether a component nobody declared is present in the artifacts at all. That
# is how HarfBuzz went undeclared through a whole ADR cycle in the first place.
# =================================================================================

# ---------------------------------------------------------------------------------
# PDFium -- prebuilt, THREE artifacts from release chromium/8044 (VERSION 155.0.8044.0).
# Upstream publishes NO checksums and NO signature; the hashes in engines/pins.toml are
# trust-on-first-use. See ADR 0004.
#
# PER-ARTIFACT DIFFERENCE, measured this audit:
#   wasm       : 14 licence files (13 upstream + PACKAGING-LICENSE.txt copied in by us)
#   linux-arm64: 15 licence files -- the same 13, plus llvm-libc.txt, plus PACKAGING
#   linux-x64  : 14 licence files -- the same 13 plus llvm-libc.txt (we add PACKAGING
#                when it is staged)
# The only component difference is LLVM libc++/libc++abi, present in both Linux builds
# and absent from the wasm build. All other licence files are byte-identical (sha256)
# across all three sets.
# ---------------------------------------------------------------------------------

