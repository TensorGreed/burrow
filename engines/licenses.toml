[[component]]
name = "zlib"
version = "1.3.2"
license = "Zlib"
license_file = "vendor/src/zlib-1.3.2/LICENSE"
license_text = "engines/licences/zlib.txt"
artifacts = ["zlib-wasm", "zlib-native-aarch64", "qpdf-wasm", "qpdf-native-aarch64", "qpdf-fuzz-aarch64"]
linked_in = ["zlib-wasm", "zlib-native-aarch64"]
linked = true
notes = """REPLACES the "zlib (Emscripten port)" entry from spike 0001. Vendored and \
sha256-pinned by engines/pins.toml; upstream also publishes a detached .asc we do not yet \
verify (provenance = tofu). Version confirmed in zlib.h: ZLIB_VERSION "1.3.2". README states \
"it does not include third-party code" for the library itself.

contrib/ CARRIES COPYLEFT AND IS NOT BUILT. contrib/ada/zlib.ads is GPL-with-linking-exception \
and the FAQ (l.356) notes contrib's match.asm is GPL. Our CMake invocation \
(-DZLIB_BUILD_SHARED=OFF -DZLIB_BUILD_TESTING=OFF) compiles only the core .c files; nothing \
from contrib/ is in libz.a. Recorded the same way ADR 0008 recorded ICU's autotools files: \
traced, not assumed. If anyone ever redistributes the zlib source tree rather than building \
from it, contrib/ must be excluded."""

[[component]]
name = "libjpeg-turbo"
version = "3.2.0"
license = "IJG AND BSD-3-Clause AND Zlib"
license_file = "vendor/native-aarch64/share/doc/libjpeg-turbo/LICENSE.md"
license_text = "engines/licences/libjpeg-turbo.md"
artifacts = ["jpeg-wasm", "jpeg-native-aarch64", "qpdf-wasm", "qpdf-native-aarch64", "qpdf-fuzz-aarch64"]
linked_in = ["jpeg-wasm", "jpeg-native-aarch64"]
linked = true
notice_required = "Documentation must state: this software is based in part on the work of the Independent JPEG Group. IJG LEGAL ISSUES condition 2."
notes = """REPLACES the "libjpeg (Emscripten port)" entry from spike 0001, and is a DELIBERATE \
codebase change: Emscripten's port delivered IJG libjpeg 9f (unmaintained branch, no SIMD, and \
the port description called it "BSD license", which is wrong). libjpeg-turbo 3.2.0 is \
maintained, has SIMD, and is the same codebase PDFium bundles. See engines/pins.toml.

EXACT COMPOSITION, from LICENSE.md and README.ijg:
  - IJG            the libjpeg API library and anything inherited from libjpeg. This is the
                   half we build and link. Carries the notice obligation above.
  - BSD-3-Clause   the TurboJPEG API library, libspng, and the build/test system. We build
                   with -DWITH_TURBOJPEG=OFF, so the TurboJPEG wrapper is not in libjpeg.a;
                   the build system is still BSD-3-Clause and still distributed.
  - Zlib           the SIMD source code. Present in the NATIVE libjpeg.a (219 NEON/SIMD
                   symbols). ABSENT from the wasm libjpeg.a: build-wasm.sh passes
                   -DWITH_SIMD=OFF. So Zlib is a native-only term for this component --
                   recorded in the expression regardless, because the source ships either way
                   and upstream states the zlib terms are subsumed by IJG in the libjpeg API
                   library.
Upstream's own roll-up says the less restrictive component terms are satisfied whenever the IJG
and Modified BSD terms are.

The Java API under jna/ is NOT built (no -DWITH_JAVA); its README notes JNA itself is
Apache-2.0-or-LGPL-2.1+, and JNA is an external Java dependency that is neither vendored here
nor reachable from a C build. Flagged because an LGPL string in the tree is exactly the thing a
grep-based audit trips over."""

[[component]]
name = "libspng (in libjpeg-turbo's cjpeg/djpeg)"
version = "bundled with libjpeg-turbo 3.2.0"
license = "BSD-2-Clause AND libpng-2.0"
license_file = "vendor/src/libjpeg-turbo-3.2.0/src/spng/LICENSE"
artifacts = ["jpeg-wasm", "jpeg-native-aarch64"]
linked_in = []
linked = false
notes = """NEW IN THIS AUDIT. libjpeg-turbo 3.2.0 vendors libspng at src/spng/ (with its own \
copy of zlib at src/spng/zlib/) for PNG support in the cjpeg and djpeg TOOLS. src/spng/spng.c \
declares SPDX-License-Identifier: (BSD-2-Clause AND libpng-2.0); both are allowlisted.

NOT in the library we link: `nm libjpeg.a | grep spng_` returns 0 for both the native and the
wasm archive. It IS compiled into the cjpeg/djpeg/jpegtran binaries that `cmake --install`
writes to vendor/{native-aarch64,wasm}/bin. Those are build-side conveniences, not burrow
artifacts, and must not be published by CI. Listed so that if they ever are, the terms are
already recorded."""

