[package]
name = "burrow-wasm"
description = "wasm-bindgen bindings for burrow, for the web app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# ONE ENGINE PER ARTIFACT, AND THE TWO ARE MUTUALLY EXCLUSIVE. `src/lib.rs` refuses a build
# that enables both or neither; see ADR 0026 and the comment there for why a `compile_error!`
# rather than a default.
#
# `documents` IS THE DEFAULT, AND THE EXCLUSIVITY IS ENFORCED ONLY ON `wasm32`. Both halves
# of that were decided by what CI already runs, not by taste:
#
#   * `cargo build --workspace` and `cargo clippy --workspace --all-targets` build this crate
#     with no feature flags. Without a default they would hit the "needs an engine" refusal
#     and the whole workspace would stop compiling.
#   * `cargo test --workspace --all-features` turns BOTH on. On a native target that is
#     harmless -- neither bridge is reachable, the tests drive `web/fake.rs` -- so refusing it
#     would mean deleting a CI gate to protect a property that native builds cannot violate.
#
# So the refusal in `src/lib.rs` is `cfg(target_arch = "wasm32")`: it fires on exactly the
# builds that produce a shipped artifact, and on nothing else. A wasm module carrying both
# bridges is unexpressible; a native test binary carrying both is meaningless and allowed.
[features]
# qpdf. merge, split, rotate, reorder, compress, and the two reads. This is the BASE payload
# every tool page loads: it must contain no PDFium, and it does not, because `render` is off.
default = ["documents"]
documents = []
# PDFium. Page rendering, and nothing else -- it does not link qpdf. Fetched only when a page
# needs a thumbnail, so nobody who merges two files ever downloads it. Built with
# `--no-default-features --features render`.
render = []

[dependencies]
burrow-core.workspace = true

# wasm-bindgen lives HERE and not in burrow-engines, deliberately. burrow-engines is
# already in the wasm32-unknown-unknown graph cargo-deny checks (via burrow-core), so
# putting wasm-bindgen and its proc-macro chain there would pull all of it into the licence
# and ban review. Keeping it in the binding also keeps `burrow-engines::web` compilable --
# and therefore testable against a fake bridge -- on every target. See ADR 0006 and 0009.
#
# Only the core crate is used: no js-sys, no web-sys. Every bridge import takes and returns
# numbers or byte slices, which is all the boundary needs, and it means deny.toml's
# web-sys feature ban (RequestInit, WebSocket, XmlHttpRequest, EventSource) has nothing to
# bite on here -- the engine fetch is in the worker's JavaScript, not in Rust.
wasm-bindgen = { version = "0.2", default-features = false, features = ["std"] }

[lints]
workspace = true
